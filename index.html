<style>
:root{--cyan:#19d3ff;--blue:#1a78ff;--text:#e6f6ff;--dim:#86b8dc;--err:#ff6b6b;--gold:#f2c230;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#01040b;color:var(--text);font-family:'Exo 2',system-ui,sans-serif}
/* ---- futuristic background (CSS layers) ---- */
#bg{position:fixed;inset:0;background:
  radial-gradient(70% 45% at 50% 38%,rgba(20,110,255,.38),transparent 70%),
  radial-gradient(60% 30% at 50% 100%,rgba(0,229,212,.18),transparent 70%),#01040b}
#grid{position:fixed;left:-50%;right:-50%;bottom:0;height:55%;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;
  background-image:linear-gradient(rgba(25,211,255,.38) 1px,transparent 1px),linear-gradient(90deg,rgba(25,211,255,.38) 1px,transparent 1px);
  background-size:60px 60px;animation:gridmove 3s linear infinite;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 85%);mask-image:linear-gradient(to top,#000 10%,transparent 85%)}
@keyframes gridmove{to{background-position:0 60px}}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
canvas#gl{z-index:1}#scan{z-index:2}
#stage{position:fixed;left:50%;bottom:calc(120px + var(--sb));width:min(150vw,980px);height:300px;z-index:0;pointer-events:none;
  transform:translateX(-50%) perspective(520px) rotateX(68deg);
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 26px,rgba(25,211,255,.6) 27px 29px,transparent 30px 58px);
  -webkit-mask-image:radial-gradient(circle,#000 25%,transparent 70%);mask-image:radial-gradient(circle,#000 25%,transparent 70%)}
.hud{position:fixed;z-index:5;background:linear-gradient(180deg,rgba(6,36,84,.64),rgba(2,10,28,.9));border:1.5px solid var(--blue);border-radius:20px;
  box-shadow:0 0 14px rgba(31,139,255,.5),inset 0 0 18px rgba(31,139,255,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.logo{width:46px;height:46px;border-radius:50%;flex:none;position:relative;border:2px solid var(--cyan);
  background:conic-gradient(#1a78ff,#19d3ff,#0a2a6a,#1a78ff);box-shadow:0 0 14px rgba(25,211,255,.7)}
.logo::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#01040b;border:2px solid var(--cyan)}
.logo.s{width:36px;height:36px}.logo.s::after{inset:7px}
.talk .logo{animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#brand{left:10px;top:calc(10px + var(--st));display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:30px;width:min(52vw,230px)}
.bn{font:700 1.15rem Orbitron,sans-serif;letter-spacing:.04em}
.onl{display:flex;align-items:center;gap:6px;font:700 .85rem 'Exo 2',sans-serif;color:#39e07a}
.onl i{width:10px;height:10px;border-radius:50%;background:#39e07a;box-shadow:0 0 10px #39e07a}
#bubble{right:10px;top:calc(10px + var(--st));display:flex;align-items:center;gap:8px;padding:9px 14px;max-width:44vw;border-radius:20px 20px 20px 4px}
#state{font:600 .85rem/1.25 'Exo 2',sans-serif;color:var(--text)}
#menu{position:fixed;z-index:5;left:10px;top:calc(88px + var(--st));display:flex;flex-direction:column;gap:7px}
.mb{display:flex;align-items:center;gap:8px;height:38px;width:112px;padding:0 10px;border-radius:14px;border:1.5px solid var(--blue);cursor:pointer;
  background:linear-gradient(180deg,rgba(6,36,84,.64),rgba(2,10,28,.9));color:var(--text);font:600 .82rem 'Exo 2',sans-serif;
  box-shadow:0 0 10px rgba(31,139,255,.45),inset 0 0 10px rgba(31,139,255,.15)}
.mb svg{width:20px;height:20px;flex:none;stroke:var(--cyan);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mb:active{transform:scale(.96)}
#wCard{display:none;right:10px;top:calc(98px + var(--st));width:min(44vw,220px);padding:10px 12px;border-radius:18px}
#wCard.show{display:block}@media(min-width:700px){#wCard{display:block}}
#wCity{font:700 .78rem Orbitron,sans-serif;letter-spacing:.03em;padding-bottom:6px;border-bottom:1px solid rgba(25,211,255,.5)}
.wt{display:flex;align-items:center;gap:8px;margin:6px 0}.wt svg{width:42px;height:42px;stroke:var(--cyan);fill:rgba(160,210,255,.25);stroke-width:1.5}
.wt b{font:700 2.2rem Orbitron,sans-serif;line-height:1}.wt sup{font-size:.9rem;font-weight:600}
#wCond{font:600 1rem 'Exo 2',sans-serif;margin-bottom:6px}
.wr{display:flex;justify-content:space-between;font:500 .8rem 'Exo 2',sans-serif;padding:4px 0;border-top:1px solid rgba(26,120,255,.4);color:var(--dim)}.wr b{color:var(--text);font-weight:600}
#bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);width:min(100%,620px);bottom:0;padding:0 12px calc(8px + var(--sb));display:flex;flex-direction:column;gap:8px}
#bottom .hud{position:relative}
#uBub{border-radius:24px;padding:0 6px 0 16px;height:46px;display:flex;align-items:center}
#cmd{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--text);font:600 1rem 'Exo 2',sans-serif}
#cmd:disabled{opacity:1;-webkit-text-fill-color:var(--text)}
#rBub{border-radius:26px;padding:8px 16px 8px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
#capBox{flex:1;min-width:0;max-height:20dvh;overflow-y:auto;scrollbar-width:thin;font:600 1rem/1.35 'Exo 2',sans-serif;color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap}
#capBox.error{color:var(--err)}#capBox a{color:var(--gold)}
.wv{display:flex;align-items:center;gap:3px;height:26px;flex:none}.wv.big{width:64px;justify-content:center}
.wv i{width:3px;height:22%;border-radius:2px;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:wv .9s ease-in-out infinite;animation-play-state:paused}
.talk .wv i{animation-play-state:running}@keyframes wv{50%{height:100%}}
#dock{border-radius:36px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.ib{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid var(--blue);background:radial-gradient(circle,rgba(31,139,255,.28),rgba(2,10,28,.9));color:var(--cyan);
  display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:0 0 10px rgba(31,139,255,.5)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ib.off{opacity:.45}.ib.mic{width:66px;height:66px;border:2px solid var(--cyan);box-shadow:0 0 20px rgba(25,211,255,.8)}.ib.mic svg{width:30px;height:30px}
.ib.on{border-color:#00e5d4;color:#00e5d4;box-shadow:0 0 22px rgba(0,229,212,.9);animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.1)}}
#langTag{position:absolute;right:-3px;bottom:-3px;font:700 .55rem Orbitron,sans-serif;background:#01040b;border:1px solid var(--blue);border-radius:8px;padding:1px 4px}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#load{position:fixed;inset:0;z-index:6;display:grid;place-items:center;font:700 .9rem Orbitron,sans-serif;color:var(--cyan);letter-spacing:.1em;pointer-events:none;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){#grid,.wv i,.logo{animation:none!important}}
</style>

 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

/* ================= CONFIG (backend unchanged) ================= */
const CONFIG = {
  API_URL:'https://aryan-ai-backend-v2.vercel.app/api/chat',
  MODEL:'./assets/models/viverse_avatar_model_202181.vrm',
  TIMEOUT_MS:45000, MAX_HISTORY:20,
  PLACE:{lat:22.5726,lon:88.3639,city:'Kolkata'},
  SPEECH_LANG:{en:'en-IN',hi:'hi-IN'}, API_LANG:{en:'en',hi:'hi'}
};
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get('jarvis.lang','en')==='hi'?'hi':'en', voiceOn=store.get('jarvis.voice','on')!=='off';
let history=[];try{const h=JSON.parse(store.get('jarvis.history','[]'));if(Array.isArray(h))history=h.filter(m=>m&&(m.role==='user'||m.role==='assistant')&&typeof m.content==='string').slice(-CONFIG.MAX_HISTORY)}catch(e){}
const L=(en,hi)=>lang==='hi'?hi:en;
let busy=false,listening=false,speaking=false,rec=null,woke=false;

/* ================= THREE SCENE ================= */
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(28,1,.1,50);
scene.add(new THREE.AmbientLight(0x8fb8ff,.9));
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(.8,1.6,2);scene.add(key);
const rim=new THREE.DirectionalLight(0x19d3ff,2.2);rim.position.set(-1.5,1.5,-1.5);scene.add(rim);

// glowing rings + particles behind avatar
const rings=new THREE.Group();rings.position.set(0,1.15,-.7);scene.add(rings);
[[.9,.008,0x19d3ff],[1.1,.005,0x1a78ff],[1.3,.01,0x00e5d4]].forEach(([r,t,c],i)=>{
  const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,128),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.75,blending:THREE.AdditiveBlending}));
  m.rotation.x=i*.35;rings.add(m);
});
const N=260,pp=new Float32Array(N*3);
for(let i=0;i<N;i++){pp[i*3]=(Math.random()-.5)*5;pp[i*3+1]=Math.random()*3;pp[i*3+2]=-Math.random()*3}
const pts=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(pp,3)),
  new THREE.PointsMaterial({color:0x6fe6ff,size:.022,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(pts);

function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const tn=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const d=Math.max(.5/(tn*camera.aspect),.78/tn);          // CHARACTER SIZE: .5 = half-width (m) kept in view; smaller = bigger avatar
  const vh=d*tn, ty=1.68-.78*vh;                           // head sits near top, torso fills centre
  camera.position.set(0,ty+.05,d);camera.lookAt(0,ty,0);camera.updateProjectionMatrix();
  rings.scale.setScalar(Math.min(1,camera.aspect*.9));
}
}
addEventListener('resize',resize);resize();

/* ================= VRM ================= */
let vrm=null;const lookTarget=new THREE.Object3D();scene.add(lookTarget);lookTarget.position.set(0,1.4,2);
const bone=n=>vrm&&vrm.humanoid.getNormalizedBoneNode(n);
new GLTFLoader().register(p=>new VRMLoaderPlugin(p)).load(CONFIG.MODEL,gltf=>{
  vrm=gltf.userData.vrm;VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.rotateVRM0(vrm);                         // VRM0 models face -Z; this fixes it (no-op for VRM1)
  vrm.scene.traverse(o=>{o.frustumCulled=false});
  scene.add(vrm.scene);
  if(vrm.lookAt)vrm.lookAt.target=lookTarget;
  $('load').style.opacity=0;
  setTimeout(()=>{ if(!woke) setGesture('wave',2.8,'happy') },600);
},undefined,err=>{console.error('[JARVIS] VRM load failed',err);$('load').textContent='AVATAR LOAD FAILED — CHECK MODEL PATH';});

addEventListener('pointermove',e=>{lookTarget.position.set((e.clientX/innerWidth-.5)*1.6,1.6-(e.clientY/innerHeight)*.8,2)});

/* ================= ANIMATION ENGINE (procedural) ================= */
const PALM=1.3; // palm roll for open hands: flip sign (-1.3) if palms face down/back
let gesture='idle',gUntil=0,emo='neutral',emoUntil=0,pulse=0,vowelI=0,vowelT=0,blinkT=2,blinkV=0,nextAuto=8;
const EMOS=['happy','sad','angry','surprised','relaxed'];
const emoW={happy:0,sad:0,angry:0,surprised:0,relaxed:0};
const VOW=['aa','ih','ou','ee','oh'],vowW={aa:0,ih:0,ou:0,ee:0,oh:0};
function setGesture(g,dur=2.5,e='neutral'){gesture=g;gUntil=clock.elapsedTime+dur;emo=e;emoUntil=clock.elapsedTime+dur+1.5}
const cur={};                                       // smoothed euler per bone
function tgt(name,x,y,z,k=.12){
  const b=bone(name);if(!b)return;
  const c=cur[name]||(cur[name]={x:0,y:0,z:0});
  c.x+=(x-c.x)*k;c.y+=(y-c.y)*k;c.z+=(z-c.z)*k;b.rotation.set(c.x,c.y,c.z);
}
function pose(t){
  const g=(gUntil>t)?gesture:'idle', s=Math.sin;
  const br=s(t*1.6)*.012;
  // base: arms down, breathing, tiny sway
  let hx=s(t*.7)*.03,hy=s(t*.5)*.05,hz=0,sx=br,sy=0;
  let LUz=-1.25,RUz=1.25,LUx=0,RUx=0,LLz=-.15,RLz=.15,LLy=0,RLy=0,PL=0;
  if(speaking||listening||g==='present'){                  // open-palm "presenting" pose like the reference
    hx+=speaking?s(t*4.1)*.04:0;hy+=speaking?s(t*2.3)*.07:0;
    LUz=-1.1+s(t*1.7)*.05;RUz=1.1-s(t*1.9)*.05;
    LLy=-1.15+s(t*2.2)*.12;RLy=1.15-s(t*2.5)*.12;LLz=0;RLz=0;PL=1}
  switch(g){
    case'wave':RUz=-1.0;RUx=0;RLy=0;PL=0;RLz=-.5+s(t*10)*.5;hz=.08;hy=-.15;break;
    case'nod':hx=.12+s(t*7)*.16;break;
    case'shake':hy=s(t*8)*.32;break;
    case'think':hz=.16;hx=-.12;hy=.2;RUz=.5;RUx=-.9;RLz=1.2;break;
    case'bow':sx=.5;hx=.25;break;
    case'cheer':LUz=1.2+s(t*6)*.1;RUz=-1.2-s(t*6)*.1;hx=-.1;break;
    case'sad':hx=.22;sx=.12;LUz=-1.35;RUz=1.35;break;
    case'angry':hx=.05;sx=-.04;LLz=-.7;RLz=.7;break;
    case'surprise':sx=-.1;hx=-.12;LUz=-.9;RUz=.9;break;
    case'laugh':sx=.06+s(t*14)*.04;hx=-.1+s(t*14)*.05;break;
    case'look':hy=s(t*1.5)*.45;break;
  }
  tgt('head',hx,hy,hz,.1);tgt('neck',hx*.4,hy*.4,hz*.4,.1);
  tgt('chest',sx,sy+hy*.2,0,.08);tgt('spine',sx*.5,0,0,.08);
  tgt('leftUpperArm',LUx,0,LUz);tgt('rightUpperArm',RUx,0,RUz);
  tgt('leftLowerArm',0,LLy,LLz);tgt('rightLowerArm',0,RLy,RLz);
  tgt('leftHand',PALM*PL,0,0);tgt('rightHand',PALM*PL,0,0);
  tgt('hips',0,0,0,.1);
}
function face(dt,t){
  const em=vrm.expressionManager;if(!em)return;
  const active=emoUntil>t?emo:'neutral';
  EMOS.forEach(e=>{emoW[e]+=((e===active?(e==='angry'?.6:.75):0)-emoW[e])*Math.min(1,dt*6);em.setValue(e,emoW[e])});
  // blink
  blinkT-=dt;if(blinkT<0){blinkV=1;blinkT=2+Math.random()*3.5}
  blinkV=Math.max(0,blinkV-dt*7);em.setValue('blink',blinkV>0?Math.sin(blinkV*Math.PI):0);
  // lip sync: vowel cycling driven by time + word-boundary pulses
  pulse=Math.max(0,pulse-dt*5);
  vowelT-=dt;if(vowelT<0){vowelI=(vowelI+1+(Math.random()*3|0))%5;vowelT=.07+Math.random()*.1}
  const open=speaking?Math.min(1,.18+.5*Math.abs(Math.sin(t*12)*Math.sin(t*4.7))+.35*pulse):0;
  VOW.forEach((v,i)=>{vowW[v]+=((speaking&&i===vowelI?open:0)-vowW[v])*Math.min(1,dt*18);em.setValue(v,vowW[v])});
}
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  rings.rotation.z+=dt*.25;rings.rotation.y=Math.sin(t*.4)*.3;
  rings.children.forEach((m,i)=>{m.rotation.x+=dt*(.15+i*.1);m.scale.setScalar(1+Math.sin(t*(speaking?4:1.2)+i)*.03)});
  pts.rotation.y+=dt*.03;pts.position.y=Math.sin(t*.3)*.05;
  if(vrm){
    pose(t);face(dt,t);
    // idle automation: random look / small gestures when nothing is happening
    if(!busy&&!speaking&&!listening&&gUntil<t&&t>nextAuto){
      const pick=['look','look','nod','think'][Math.random()*4|0];setGesture(pick,2.2,pick==='nod'?'happy':'relaxed');nextAuto=t+8+Math.random()*8}
    if(gUntil<t&&busy)setGesture('think',1.2,'relaxed');
    vrm.update(dt);
  }
  renderer.render(scene,camera);
}
frame();

/* ================= INTENT → ANIMATION ================= */
const KW=[
 [/\b(hello|hi|hey|namaste|namaskar|good (morning|evening|afternoon)|jarvis)\b|नमस्ते|हेलो|प्रणाम/i,'wave','happy'],
 [/\b(thank|thanks|shukriya|dhanyavad|bye|goodbye|alvida)\b|धन्यवाद|शुक्रिया|अलविदा/i,'bow','happy'],
 [/\b(sorry|maaf|sad|dukh|cry|rona|miss you|alone)\b|माफ़|दुख|उदास/i,'sad','sad'],
 [/\b(joke|funny|haha|lol|hasao|hasi|mazak)\b|हँस|मज़ाक|चुटकुला/i,'laugh','happy'],
 [/\b(congrat|win|won|great|awesome|amazing|badhai|mubarak|party)\b|बधाई|मुबारक/i,'cheer','happy'],
 [/\b(angry|gussa|idiot|stupid|hate|bakwas)\b|गुस्सा|बकवास/i,'angry','angry'],
 [/\b(wow|really|seriously|sach|kya baat|shock)\b|क्या बात|सच में/i,'surprise','surprised'],
 [/\b(yes|yeah|sure|ok|okay|haan|han|theek|correct|right)\b|हाँ|हां|ठीक/i,'nod','happy'],
 [/\b(no|nahi|nahin|never|wrong|galat)\b|नहीं|ना|गलत/i,'shake','sad'],
 [/\b(why|how|what|kyun|kaise|kya|explain|batao|samjhao)\b|\?|क्यों|कैसे|क्या|समझाओ/i,'think','relaxed']
];
function react(userText,replyText){
  const hit=s=>KW.find(k=>k[0].test(s));
  const k=hit(userText||'')||hit((replyText||'').slice(0,160));
  if(k)setGesture(k[1],2.8,k[2]);else setGesture('present',3,'happy');
}

/* ================= UI helpers ================= */
function setState(){
  $('state').textContent=listening?'Yes Sir, I am listening…':busy?'Processing…':speaking?'Speaking…':'Say “Hello Jarvis” or tap the mic';
  $('mic').classList.toggle('on',listening);document.body.classList.toggle('talk',listening||speaking||busy)}
let capTimer=0;
function showCap(text,kind='',link=null){
  const b=$('capBox');b.className=kind;$('capTxt').textContent=text;$('capLink').innerHTML='';
  if(link){const a=document.createElement('a');a.href=link.url;a.target='_blank';a.rel='noopener';a.textContent=link.label;$('capLink').appendChild(a)}
  clearTimeout(capTimer);capTimer=setTimeout(()=>{if(!speaking)b.classList.add('hide')},Math.max(6000,text.length*70));
}
function setBusy(b){busy=b;$('cmd').disabled=b;setState()}

/* ================= SPEECH OUT (drives lip sync) ================= */
let voices=[];const loadV=()=>{if('speechSynthesis'in window)voices=speechSynthesis.getVoices()};
if('speechSynthesis'in window){loadV();speechSynthesis.onvoiceschanged=loadV}
const pickVoice=c=>{c=c.toLowerCase();const n=v=>v.lang.replace('_','-').toLowerCase();return voices.find(v=>n(v)===c)||voices.find(v=>n(v).startsWith(c.slice(0,2)))||null};
let token=0;
function stopSpeech(){token++;if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;setState()}
function speak(text){
  if(!voiceOn||!('speechSynthesis'in window)){fakeTalk(text);return}
  stopSpeech();
  const clean=text.replace(/```[\s\S]*?```/g,' ').replace(/https?:\/\/\S+/g,' link ').replace(/[*_#`>~|]/g,'').replace(/\s+/g,' ').trim().slice(0,2500);
  if(!clean)return;
  const parts=clean.match(/[^.!?।\n]+[.!?।]?/g)||[clean],chunks=[];let c='';
  parts.forEach(p=>{if((c+p).length>180&&c){chunks.push(c);c=p}else c+=p});if(c.trim())chunks.push(c);
  const my=++token;
  chunks.forEach((ch,i)=>{
    const u=new SpeechSynthesisUtterance(ch.trim());
    const code=/[\u0900-\u097F]/.test(ch)?CONFIG.SPEECH_LANG.hi:CONFIG.SPEECH_LANG.en;
    u.lang=code;const v=pickVoice(code);if(v)u.voice=v;
    u.onstart=()=>{if(my===token){speaking=true;setState()}};
    u.onboundary=()=>{if(my===token)pulse=1};
    if(i===chunks.length-1)u.onend=u.onerror=()=>{if(my===token){speaking=false;setState();$('capBox').classList.add('hide')}};
    speechSynthesis.speak(u);
  });
}
function fakeTalk(text){ // voice muted: mouth still moves while caption is shown
  const my=++token;speaking=true;setState();
  setTimeout(()=>{if(my===token){speaking=false;setState()}},Math.min(12000,text.length*55));
}
function output(text,kind='',link=null,userText=''){
  showCap(text,kind,link);
  if(kind!=='error')react(userText,text);
  speak(text);
}

/* ================= LOCAL COMMANDS ================= */
let weather=null;
const WMO={0:'Clear sky',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Rain showers',81:'Rain showers',82:'Heavy showers',95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
let wT=0;function showW(){$('wCard').classList.add('show');clearTimeout(wT);wT=setTimeout(()=>$('wCard').classList.remove('show'),15000)}
async function loadWeather(){
  try{const p=CONFIG.PLACE;const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&wind_speed_unit=ms`);
    const j=(await r.json()).current;
    weather={t:j.temperature_2m,f:j.apparent_temperature,h:j.relative_humidity_2m,w:j.wind_speed_10m,c:WMO[j.weather_code]||'Unknown',city:p.city};
    $('wCity').textContent=p.city.toUpperCase()+' WEATHER';$('wTemp').textContent=Math.round(weather.t);$('wCond').textContent=weather.c;
    $('wHum').textContent=weather.h+'%';$('wWind').textContent=weather.w+' m/s';$('wFeel').textContent=Math.round(weather.f)+'°C';
  }catch(e){weather=null}
}
if(navigator.geolocation)navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude;let city='Your area';
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);const j=await r.json();city=j.city||j.locality||j.principalSubdivision||city}catch(e){}
  CONFIG.PLACE={lat,lon,city};loadWeather()},()=>{},{timeout:8000,maximumAge:600000});
loadWeather();setInterval(loadWeather,600000);
let batt=null;if(navigator.getBattery)navigator.getBattery().then(b=>batt=b).catch(()=>{});
const openUrl=(url,label)=>window.open(url,'_blank')?null:{url,label};
const actions={
  time:()=>({text:L('It is ','अभी ')+new Date().toLocaleTimeString(lang==='hi'?'hi-IN':'en-IN',{hour:'2-digit',minute:'2-digit'})+L('.',' बजे हैं।')}),
  date:()=>({text:L('Today is ','आज ')+new Date().toLocaleDateString(lang==='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+L('.',' है।')}),
  battery:()=>batt?({text:L(`Battery is at ${Math.round(batt.level*100)} percent${batt.charging?' and charging':''}.`,`बैटरी ${Math.round(batt.level*100)} प्रतिशत है${batt.charging?' और चार्ज हो रही है':''}।`)}):({text:L('Battery data is not available here.','यहाँ बैटरी की जानकारी उपलब्ध नहीं है।')}),
  async weather(){await loadWeather();showW();if(!weather)return{text:L('Weather is unavailable right now.','अभी मौसम उपलब्ध नहीं है।'),kind:'error'};
    return{text:L(`${weather.city}: ${weather.t} degrees, humidity ${weather.h} percent, wind ${weather.w} metres per second.`,`${weather.city}: तापमान ${weather.t} डिग्री, नमी ${weather.h} प्रतिशत, हवा ${weather.w} मीटर प्रति सेकंड।`)}},
  youtube:()=>({text:L('Opening YouTube.','यूट्यूब खोल रहा हूँ।'),link:openUrl('https://www.youtube.com','Tap to open YouTube')}),
  google:()=>({text:L('Opening Google.','गूगल खोल रहा हूँ।'),link:openUrl('https://www.google.com','Tap to open Google')}),
  search:q=>({text:L('Searching Google for: ','गूगल पर खोज रहा हूँ: ')+q,link:openUrl('https://www.google.com/search?q='+encodeURIComponent(q),'Tap to open results')}),
  clear:()=>{history=[];store.set('jarvis.history','[]');return{text:L('Conversation memory cleared.','बातचीत की मेमोरी साफ़ कर दी गई।')}}
};
function matchLocal(raw){
  const t=raw.toLowerCase().replace(/[?!.,।]/g,' ').replace(/\s+/g,' ').trim(),n=t.split(' ').length;let m;
  if((m=t.match(/^(?:google search|search on google|search google for|google for)\s+(.+)$/)))return['search',m[1]];
  if(/^(open|launch|start)\s+youtube$/.test(t)||/^youtube\s+(kholo|khol do|open)$/.test(t))return['youtube'];
  if(/^(open|launch|start)\s+google$/.test(t)||/^google\s+(kholo|khol do|open)$/.test(t))return['google'];
  if(/^(clear|reset)\s+(chat|memory|conversation|history)$/.test(t))return['clear'];
  if(n<=6&&/\b(weather|mausam)\b|मौसम/.test(t)&&!/\b(in|at|of|for|mein|me)\b|\bमें\b/.test(t))return['weather'];
  if(n<=5&&/\bbattery\b|बैटरी/.test(t))return['battery'];
  if(n<=6&&/\b(date|tarikh|tareekh)\b|तारीख|\bwhat day\b/.test(t))return['date'];
  if(n<=6&&/\b(time|samay|waqt|baje)\b|समय|कितने बजे/.test(t)&&!/\b(in|at|zone|complexity|machine|travel|table|series)\b/.test(t))return['time'];
  return null;
}

/* ================= BACKEND ================= */
const extractReply=j=>{const r=(j&&j.data&&typeof j.data.reply==='string')?j.data.reply:(j&&typeof j.reply==='string')?j.reply:null;return r&&r.trim()?r.trim():null};
async function askBackend(text){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),CONFIG.TIMEOUT_MS);
  try{
    const res=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,messages:history.slice(-CONFIG.MAX_HISTORY),language:CONFIG.API_LANG[lang]}),signal:ctl.signal});
    const raw=await res.text();let json=null;try{json=JSON.parse(raw)}catch(e){}
    if(!res.ok){const d=json&&(typeof json.error==='string'?json.error:json.error&&json.error.message);throw{kind:'http',status:res.status,detail:d}}
    const reply=extractReply(json);if(!reply)throw{kind:'invalid'};return reply;
  }catch(e){if(e&&e.kind)throw e;if(e&&e.name==='AbortError')throw{kind:'timeout'};throw{kind:'network'}}
  finally{clearTimeout(to)}
}
function errorText(e){
  if(!navigator.onLine)return L('You are offline. Check your internet connection.','आप ऑफ़लाइन हैं। इंटरनेट कनेक्शन जाँचें।');
  switch(e.kind){
    case'timeout':return L('Aryan AI took too long to respond. Please try again.','Aryan AI ने समय पर जवाब नहीं दिया। फिर से कोशिश करें।');
    case'http':return L(`Aryan AI backend error (HTTP ${e.status})${e.detail?': '+e.detail:''}.`,`Aryan AI बैकएंड में त्रुटि (HTTP ${e.status})।`);
    case'invalid':return L('Aryan AI sent an invalid response. Please try again.','Aryan AI से अमान्य जवाब मिला।');
    default:return L('Aryan AI backend is unavailable right now.','Aryan AI बैकएंड अभी उपलब्ध नहीं है।');
  }
}

/* ================= SUBMIT ================= */
async function submit(raw){
  const text=(raw||'').trim();if(!text||busy)return;
  woke=true;stopSpeech();
  const local=matchLocal(text);
  setBusy(true);
  try{
    if(local){const o=await actions[local[0]](local[1]);output(o.text,o.kind||'',o.link||null,text);return}
    showCap(L('Thinking…','सोच रहा हूँ…'));setGesture('think',60,'relaxed');
    try{
      const reply=await askBackend(text);
      history.push({role:'user',content:text},{role:'assistant',content:reply});
      history=history.slice(-CONFIG.MAX_HISTORY);store.set('jarvis.history',JSON.stringify(history));
      gUntil=0;output(reply,'',null,text);
    }catch(e){gUntil=0;output(errorText(e),'error');setGesture('sad',3,'sad')}
  }finally{setBusy(false)}
}

/* ================= VOICE IN ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function toggleListen(){
  if(listening){rec&&rec.stop();return}
  if(busy)return;stopSpeech();
  if(!SR)return showCap(L('Voice input is not supported in this browser. Try Chrome.','इस ब्राउज़र में वॉइस इनपुट समर्थित नहीं है।'),'error');
  rec=new SR();rec.lang=CONFIG.SPEECH_LANG[lang];rec.interimResults=true;rec.continuous=false;
  let fin='',heard=false;
  rec.onstart=()=>{listening=true;setState();showCap(L('Listening…','सुन रहा हूँ…'));setGesture('look',60,'relaxed')};
  rec.onresult=e=>{heard=true;let t='';for(let i=0;i<e.results.length;i++){t+=e.results[i][0].transcript;if(e.results[i].isFinal)fin=t}$('cmd').value=t};
  rec.onerror=e=>{const m={'not-allowed':L('Microphone permission denied.','माइक्रोफ़ोन की अनुमति नहीं मिली।'),'no-speech':L('I did not hear anything.','कुछ सुनाई नहीं दिया।'),'audio-capture':L('No microphone found.','माइक्रोफ़ोन नहीं मिला।'),'network':L('Speech recognition needs internet.','वॉइस पहचान के लिए इंटरनेट चाहिए।')}[e.error];if(m)showCap(m,'error');heard=true;fin=''};
  rec.onend=()=>{listening=false;gUntil=0;setState();const t=(fin||$('cmd').value).trim();if(t)submit(t);else if(!heard)showCap(L('I did not hear anything.','कुछ सुनाई नहीं दिया।'),'error')};
  try{rec.start()}catch(e){listening=false;setState()}
}

/* ================= WIRING ================= */
$('cmd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit($('cmd').value)}});
$('mic').onclick=toggleListen;
const refresh=()=>{$('langTag').textContent=lang==='hi'?'हि':'EN';$('cmd').placeholder=lang==='hi'?'संदेश लिखें या बोलें…':'Hey Jarvis, type or speak…';$('spkBtn').classList.toggle('off',!voiceOn)};
$('langBtn').onclick=()=>{lang=lang==='en'?'hi':'en';store.set('jarvis.lang',lang);refresh();if(listening&&rec)rec.stop();showCap(lang==='hi'?'भाषा: हिंदी':'Language: English')};
$('spkBtn').onclick=()=>{voiceOn=!voiceOn;store.set('jarvis.voice',voiceOn?'on':'off');if(!voiceOn)stopSpeech();refresh();showCap(voiceOn?L('Voice output on.','आवाज़ चालू।'):L('Voice output off.','आवाज़ बंद।'))};
// first tap anywhere = wake (browsers need a gesture before speech works)
addEventListener('pointerdown',function w(e){if(woke||e.target.closest('button,input,#wCard'))return;woke=true;
  const g=L('Online, sir. How can I help?','ऑनलाइन हूँ, सर। क्या करना है?');output(g,'',null,'hello')},{once:false});
document.querySelectorAll('.wv').forEach(w=>{const n=+w.dataset.n||14;for(let i=0;i<n;i++){const b=document.createElement('i');b.style.animationDelay=(i*.06)+'s';b.style.animationDuration=(.55+(i%5)*.13)+'s';w.appendChild(b)}});
const sys=()=>{const c=navigator.connection;return{text:L(`Internet ${navigator.onLine?'connected':'offline'}${c&&c.effectiveType?' ('+c.effectiveType+')':''}.${navigator.deviceMemory?' Device memory about '+navigator.deviceMemory+' GB.':''}`,`इंटरनेट ${navigator.onLine?'चालू':'बंद'} है।`)}};
async function quick(k){
  if(busy)return;woke=true;
  if(k==='search'){stopSpeech();$('cmd').value='google search ';$('cmd').focus();return}
  if(k==='more')return output(L('Try: weather, battery, time, date, open youtube, google search …, clear chat — or ask me anything.','आज़माएँ: मौसम, बैटरी, समय, तारीख, open youtube, google search …, clear chat — या कुछ भी पूछें।'),'',null,'');
  stopSpeech();$('cmd').value={weather:'Weather',youtube:'Open YouTube',system:'System',battery:'Battery'}[k];setBusy(true);
  try{const o=k==='system'?sys():await actions[k]();output(o.text,o.kind||'',o.link||null,'')}finally{setBusy(false)}
}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>quick(b.dataset.q));
$('dHome').onclick=()=>{woke=true;stopSpeech();output(L('Online, sir. How can I help?','ऑनलाइन हूँ, सर। क्या करना है?'),'',null,'hello')};
$('dPower').onclick=()=>{stopSpeech();if(listening&&rec)rec.stop();setGesture('bow',2,'relaxed')};
$('cmd').addEventListener('focus',e=>e.target.select());
refresh();setState();
if('serviceWorker'in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
