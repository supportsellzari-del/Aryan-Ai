<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020a12">
<title>JARVIS AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020a12;
    color: #00eaff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    height: 100dvh;
    width: 100%;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%,
      #06323b 0%, #03151e 40%, #02080e 100%);
}

/* Background */

.grid {
    position: absolute;
    inset: 0;
    opacity: .16;
    background-image:
      linear-gradient(#00eaff33 1px, transparent 1px),
      linear-gradient(90deg,#00eaff33 1px,transparent 1px);
    background-size: 45px 45px;
    transform: perspective(500px) rotateX(15deg) scale(1.4);
}

.glow {
    position: absolute;
    width: 350px;
    height: 350px;
    background: #00eaff18;
    filter: blur(90px);
    border-radius: 50%;
    top: 35%;
    left: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
}

/* Header */

header {
    height: 65px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #00eaff55;
    background: #020e17dd;
    position: relative;
    z-index: 10;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 0 20px #00eaff;
}

.status {
    font-size: 12px;
    color: #00ffad;
}

/* Avatar Stage */

.stage {
    position: absolute;
    top: 65px;
    bottom: 145px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

#avatar {
    position: absolute;
    inset: 0;
    z-index: 2;
}

#avatar canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* Hologram */

.ring {
    position: absolute;
    width: min(75vw, 380px);
    aspect-ratio: 1;
    border: 1px solid #00eaff55;
    border-radius: 50%;
    box-shadow:
      0 0 35px #00eaff22,
      inset 0 0 35px #00eaff22;
    animation: rotate 18s linear infinite;
}

.ring::before {
    content: "";
    position: absolute;
    inset: 25px;
    border: 1px dashed #00eaff99;
    border-radius: 50%;
}

.ring::after {
    content: "";
    position: absolute;
    inset: 55px;
    border: 1px solid #00eaff55;
    border-radius: 50%;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.scan {
    position: absolute;
    width: 100%;
    height: 2px;
    background: #00eaff77;
    box-shadow: 0 0 15px #00eaff;
    animation: scanning 6s linear infinite;
    z-index: 3;
    pointer-events: none;
}

@keyframes scanning {
    from { top: 10%; }
    to { top: 90%; }
}

/* Avatar label */

.avatar-label {
    position: absolute;
    bottom: 10px;
    z-index: 5;
    text-align: center;
    letter-spacing: 5px;
    font-size: 12px;
    text-shadow: 0 0 15px #00eaff;
    pointer-events: none;
}

/* Information */

.info {
    position: absolute;
    top: 85px;
    left: 15px;
    z-index: 5;
    font-size: 10px;
    line-height: 2;
    color: #71cbd4;
    letter-spacing: 1px;
    pointer-events: none;
}

.info.right {
    left: auto;
    right: 15px;
    text-align: right;
}

/* Chat */

.bottom {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 12px 18px 20px;
    background: linear-gradient(transparent,#020a12 25%);
    z-index: 10;
}

#message {
    min-height: 28px;
    text-align: center;
    font-size: 14px;
    color: #a2e8ed;
    margin-bottom: 12px;
    line-height: 1.5;
}

.chat {
    display: flex;
    gap: 10px;
    max-width: 750px;
    margin: auto;
}

.chat input {
    flex: 1;
    min-width: 0;
    background: #031b26;
    border: 1px solid #00eaff99;
    border-radius: 35px;
    padding: 17px;
    color: white;
    font-size: 15px;
    outline: none;
}

.chat button {
    background: #003744;
    color: #00eaff;
    border: 1px solid #00eaff;
    border-radius: 35px;
    padding: 0 25px;
    font-size: 14px;
    font-weight: bold;
}

.chat button:active {
    background: #006477;
}

/* Speaking Visualizer */

.visualizer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 4px;
    height: 22px;
    margin-bottom: 8px;
}

.visualizer span {
    width: 3px;
    height: 5px;
    background: #00eaff;
    border-radius: 5px;
}

.visualizer.active span {
    animation: wave .5s infinite alternate;
}

.visualizer span:nth-child(2) {animation-delay:.1s}
.visualizer span:nth-child(3) {animation-delay:.2s}
.visualizer span:nth-child(4) {animation-delay:.3s}
.visualizer span:nth-child(5) {animation-delay:.4s}

@keyframes wave {
    to { height: 20px; }
}

/* Mobile */

@media(max-width:600px) {
    .logo {
        font-size: 23px;
    }

    .stage {
        bottom: 155px;
    }

    .ring {
        width: 72vw;
    }

    .info {
        font-size: 9px;
        top: 25px;
    }

    .bottom {
        padding: 10px 14px 18px;
    }

    .chat input {
        padding: 15px;
        font-size: 14px;
    }

    .chat button {
        padding: 0 20px;
    }
}

@media(max-height:550px) {
    .stage {
        bottom: 100px;
    }

    .ring {
        width: 190px;
    }

    .bottom {
        padding: 5px 12px;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="grid"></div>
<div class="glow"></div>

<header>
    <div class="logo">JARVIS</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<div class="info">
    AI CORE : ACTIVE<br>
    AVATAR : 3D ONLINE<br>
    MODE : ASSISTANT
</div>

<div class="info right">
    SYSTEM V2.0<br>
    HOLOGRAM : ACTIVE<br>
    SECURITY : ON
</div>

<main class="stage">

    <div class="ring"></div>

    <div id="avatar"></div>

    <div class="scan"></div>

    <div class="avatar-label">
        JARVIS AI ASSISTANT
    </div>

</main>

<div class="bottom">

    <div class="visualizer" id="visualizer">
        <span></span><span></span><span></span>
        <span></span><span></span>
    </div>

    <div id="message">
        Hello Sir! JARVIS is ready.
    </div>

    <div class="chat">
        <input id="chatInput"
        placeholder="Talk to JARVIS..."
        autocomplete="off">

        <button onclick="sendMessage()">SEND</button>
    </div>

</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";

import {
    VRMLoaderPlugin,
    VRMUtils
} from "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js";


const container = document.getElementById("avatar");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    30,
    1,
    0.1,
    100
);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
    0xffffff,
    0x334455,
    2
));

const light = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

light.position.set(1, 3, 4);
scene.add(light);

let currentVRM = null;
let headBone = null;

const loader = new GLTFLoader();

loader.register(parser =>
    new VRMLoaderPlugin(parser)
);


// Load Avatar

loader.load(
    "./assets/models/viverse_avatar_model_202181.vrm",

    (gltf) => {

        const vrm = gltf.userData.vrm;

        if (!vrm) {
            throw new Error("VRM model not found");
        }

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);

        currentVRM = vrm;

        // Find head bone
        headBone = vrm.humanoid.getNormalizedBoneNode("head");

        // Fit avatar automatically
        const box = new THREE.Box3().setFromObject(vrm.scene);

        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const height = size.y || 2;

        const scale = 2.2 / height;

        vrm.scene.scale.setScalar(scale);

        vrm.scene.position.set(
            -center.x * scale,
            -box.min.y * scale,
            -center.z * scale
        );

        camera.position.set(0, 1.05, 4.8);

        camera.lookAt(0, 1.05, 0);

        document.getElementById("message").textContent =
            "JARVIS Avatar Successfully Loaded";

    },

    undefined,

    (error) => {

        console.error("VRM Error:", error);

        document.getElementById("message").textContent =
            "Avatar Error: Check Model File";

    }
);


// Resize

function resize() {

    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

}

window.addEventListener("resize", resize);
resize();


// Animation

const clock = new THREE.Clock();

let blinkTimer = 0;
let nextBlink = 3;
let blinking = false;
let blinkProgress = 0;

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (currentVRM) {

        const time = clock.elapsedTime;

        // Natural head movement
        if (headBone) {

            headBone.rotation.y =
                Math.sin(time * 0.65) * 0.045;

            headBone.rotation.x =
                Math.sin(time * 0.8) * 0.018;

        }

        // Eye blinking
        const expressions = currentVRM.expressionManager;

        if (expressions) {

            blinkTimer += delta;

            if (!blinking && blinkTimer >= nextBlink) {
                blinking = true;
                blinkProgress = 0;
            }

            if (blinking) {

                blinkProgress += delta;

                const blinkValue =
                    Math.sin(Math.min(blinkProgress / 0.16, 1) * Math.PI);

                expressions.setValue("blink", blinkValue);

                if (blinkProgress >= 0.32) {

                    expressions.setValue("blink", 0);

                    blinking = false;
                    blinkTimer = 0;

                    nextBlink = 2.5 + Math.random() * 3;

                }
            }

        }

        currentVRM.update(delta);

    }

    renderer.render(scene, camera);

}

animate();


// Lip Sync helper for future voice connection

window.jarvisLipSync = function(value) {

    if (!currentVRM || !currentVRM.expressionManager) return;

    currentVRM.expressionManager.setValue(
        "aa",
        Math.max(0, Math.min(1, value))
    );

};

window.jarvisStopLipSync = function() {
    window.jarvisLipSync(0);
};

</script>

<script>

// Interface test

function sendMessage() {

    const input = document.getElementById("chatInput");

    const message = input.value.trim();

    if (!message) return;

    document.getElementById("message").textContent =
        "Sir, AI Backend will be connected in the next step.";

    input.value = "";

}

document.getElementById("chatInput")
.addEventListener("keydown", function(e) {

    if (e.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
