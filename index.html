<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0F2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aryan AI">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Aryan AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--haldi:#F4B42A;--bg:#F1F0F9;--surface:#fff;--ink:#14173F;--muted:#5A5E87;--line:#D8D7EB;--mark:#1B1F5E;--focus:#14173F;--ok:#5E8A2F;--bad:#C2413B}
@media(prefers-color-scheme:dark){:root{--bg:#0C0F2E;--surface:#151945;--ink:#ECEBFA;--muted:#9B9EC9;--line:#282D68;--mark:#F4B42A;--focus:#F4B42A;--ok:#8DBB55;--bad:#F0827B}}
:root[data-theme=light]{color-scheme:light;--bg:#F1F0F9;--surface:#fff;--ink:#14173F;--muted:#5A5E87;--line:#D8D7EB;--mark:#1B1F5E;--focus:#14173F;--ok:#5E8A2F;--bad:#C2413B}
:root[data-theme=dark]{color-scheme:dark;--bg:#0C0F2E;--surface:#151945;--ink:#ECEBFA;--muted:#9B9EC9;--line:#282D68;--mark:#F4B42A;--focus:#F4B42A;--ok:#8DBB55;--bad:#F0827B}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:400 16.5px/1.7 "Hind","Noto Sans Devanagari",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto}
.top{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;padding-top:calc(8px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}.lotus{color:var(--mark);overflow:visible;flex:none}.word{font:400 23px/1.1 "Tiro Devanagari Hindi",serif}.word small{font:600 12px "Hind",sans-serif;letter-spacing:.08em;color:var(--muted);margin-left:6px}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.ib{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}.ib:hover{background:var(--line)}.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chat{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.hero{position:relative;overflow:hidden;margin:0 -16px;padding:0 16px}.chat.started .hero{display:none}.hero-art{width:min(78vw,300px);margin-left:auto;transform:translateX(18%);color:var(--mark)}.hero-art svg{width:100%;height:auto;display:block}
.hero h1{font:400 clamp(52px,15vw,80px)/1.05 "Tiro Devanagari Hindi",serif;margin:2px 0 8px}.hero p{margin:0 0 20px;color:var(--muted);max-width:34ch}
.prompts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}.pr{display:block;width:100%;text-align:left;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
#msgs{display:flex;flex-direction:column;gap:20px}.msg.user{align-self:flex-end;max-width:85%;background:var(--haldi);color:#14173F;padding:9px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}.msg.ai .av{margin-top:5px;color:var(--mark)}.msg.ai .body{min-width:0}.txt{white-space:pre-wrap;overflow-wrap:anywhere}.txt.err{color:var(--bad)}
.txt code{font:500 .9em ui-monospace,Menlo,Consolas,monospace;background:var(--line);padding:1px 6px;border-radius:6px}.txt pre{white-space:pre;overflow-x:auto;margin:8px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;line-height:1.5}.txt pre code{background:none;padding:0;font-size:13.5px}
.acts{display:flex;gap:4px;margin-top:2px}.mini{border:0;background:none;color:var(--muted);font-size:13.5px;padding:6px 8px;min-height:36px;border-radius:8px;cursor:pointer}
.comp{padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}.box{display:flex;align-items:flex-end;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:4px 4px 4px 16px}.box:focus-within{border-color:var(--focus)}
.box textarea{flex:1;border:0;outline:none;background:transparent;resize:none;padding:10px 4px;max-height:140px;line-height:1.5;min-width:0}.box textarea::placeholder{color:var(--muted)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--haldi);color:#14173F;display:grid;place-items:center;cursor:pointer;flex:none}.send svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.send:disabled{opacity:.4;cursor:default}
.foot{margin:8px 0 0;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.4}
.wrap{position:fixed;inset:0;display:none;z-index:10}.wrap.open{display:flex;align-items:flex-end;justify-content:center}.scrim{position:absolute;inset:0;background:rgba(8,10,35,.55)}
.sheet{position:relative;width:100%;max-width:760px;max-height:90dvh;overflow-y:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.sheet h2{font:400 24px/1.2 "Tiro Devanagari Hindi",serif;margin:0}
.fld{display:block;margin:14px 0 0}.fld span{display:block;font-weight:500;margin-bottom:4px}.fld small{display:block;color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:4px}
.fld input[type=text],.fld textarea{width:100%;padding:12px;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;outline:none}
.chk{display:flex;align-items:center;gap:10px;margin:16px 0 0;min-height:44px}.chk input{width:20px;height:20px;accent-color:var(--haldi)}
.save{width:100%;margin-top:18px;min-height:48px;border:0;border-radius:14px;background:var(--haldi);color:#14173F;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><span id="brandMark"></span><div style="min-width:0"><div class="word">आर्यन<small>AI</small></div><div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Backend se jud raha hai...</span></div></div></div>
 <button class="ib" id="newChat" aria-label="Nayi chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
 <button class="ib" id="theme" aria-label="Theme badlo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
 <button class="ib" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
</header>
<main class="chat" id="chat" aria-live="polite">
 <section class="hero" id="hero"><div class="hero-art" id="heroArt"></div><h1>नमस्ते</h1><p>Main Aryan hu. Hindi, Hinglish ya English me kuch bhi poochho.</p>
 <ul class="prompts" id="prompts"></ul></section><div id="msgs"></div>
</main>
<footer class="comp"><div class="box"><textarea id="ta" rows="1" placeholder="Yahan likho ya mic dabao" aria-label="Message likho"></textarea>
 <button class="ib" id="mic" aria-label="Bolkar likho"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
 <button class="send" id="send" aria-label="Bhejo" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div><p class="foot">Made in India 🇮🇳. Zaroori jawab dobara check kar lo.</p></footer>
</div>
<div class="wrap" id="wrap"><div class="scrim" id="scrim"></div><section class="sheet" role="dialog" aria-modal="true">
 <div class="sheet-head"><h2>Settings</h2><button class="ib" id="shClose" aria-label="Band karo">✕</button></div>
 <label class="fld"><span>Aryan ko kaam batao</span><textarea id="fSys" rows="4"></textarea><small>Ye instruction har chat ke saath backend ko bheji jayegi.</small></label>
 <label class="chk"><input type="checkbox" id="fSpeak"><span>Jawab bolkar sunao</span></label>
 <button class="save" id="save">Save karo</button>
</section></div>
<script>
const API_URL='https://aryan-backend-lber.vercel.app/api/chat';
const $=s=>document.querySelector(s);
const state={messages:[],busy:false,ctrl:null,system:'Tum Aryan AI ho, ek Indian AI assistant. User jis bhasha me likhe (Hindi, Hinglish ya English), usi me saaf, upyogi aur sachcha jawab do.',speak:false};
function lotus(size){let paths='';for(let i=0;i<8;i++){paths+=`<path transform="rotate(${i*45} 50 50)" d="M50 50C38 36 38 16 50 6C62 16 62 36 50 50Z"/>`;paths+=`<path transform="rotate(${22.5+i*45} 50 50)" d="M50 50C44 42 44 30 50 24C56 30 56 42 50 50Z"/>`;}return `<svg class="lotus" width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">${paths}<circle cx="50" cy="50" r="3.2" fill="var(--haldi)" stroke="none"/></svg>`;}
$('#brandMark').innerHTML=lotus(34);$('#heroArt').innerHTML=lotus(300);
const prompts=['Ek chhoti kahani sunao, Indian gaon ki','Kal ke liye study plan banao','Boss ko chhutti ka email Hindi me likho','Python ka for loop simple tarike se samjhao'];
$('#prompts').innerHTML=prompts.map(p=>`<li><button class="pr">${p}</button></li>`).join('');
document.querySelectorAll('.pr').forEach(b=>b.addEventListener('click',()=>send(b.textContent)));
const chat=$('#chat'),ta=$('#ta'),sendBtn=$('#send');
function status(kind,msg){$('#dot').className='dot'+(kind==='ok'?' ok':kind==='bad'?' bad':'');$('#statusTxt').textContent=msg;}
function bottom(){chat.scrollTop=chat.scrollHeight;}
function escapeHTML(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function formatText(t){return t.split('```').map((p,i)=>i%2?`<pre><code>${escapeHTML(p.replace(/^[^\n]*\n/,'').replace(/\n$/,''))}</code></pre>`:escapeHTML(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')).join('');}
function addUser(t){let e=document.createElement('div');e.className='msg user';e.textContent=t;$('#msgs').append(e);bottom();}
function addAI(){let e=document.createElement('div');e.className='msg ai';e.innerHTML=`<span class="av">${lotus(26)}</span><div class="body"><div class="txt">Soch raha hoon...</div><div class="acts"></div></div>`;$('#msgs').append(e);bottom();return e;}
function setBusy(b){state.busy=b;sendBtn.disabled=!b&&!ta.value.trim();sendBtn.innerHTML=b?'<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>':'<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';}
async function send(text){
 text=(text||'').trim();if(!text||state.busy)return;
 if(window.speechSynthesis)speechSynthesis.cancel();
 chat.classList.add('started');addUser(text);
 const previous=state.messages.slice();state.messages.push({role:'user',content:text});
 const ai=addAI(),txt=ai.querySelector('.txt');state.ctrl=new AbortController();setBusy(true);
 try{
  const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:state.ctrl.signal,body:JSON.stringify({message:text,history:previous,system:state.system})});
  let data;try{data=await response.json();}catch{throw new Error('Server se valid JSON jawab nahi mila.');}
  if(!response.ok||!data.success)throw new Error(data.error||('HTTP '+response.status));
  if(typeof data.reply!=='string'||!data.reply.trim())throw new Error('AI ka jawab khali aaya.');
  const answer=data.reply;txt.innerHTML=formatText(answer);status('ok','Aryan AI Online · '+(data.model||'Groq'));
  state.messages.push({role:'assistant',content:answer});
  const cp=document.createElement('button');cp.className='mini';cp.textContent='Copy karo';cp.onclick=async()=>{try{await navigator.clipboard.writeText(answer);cp.textContent='Copy ho gaya';}catch{cp.textContent='Copy nahi hua';}};ai.querySelector('.acts').append(cp);
  if(state.speak&&'speechSynthesis'in window){let u=new SpeechSynthesisUtterance(answer);u.lang='hi-IN';speechSynthesis.speak(u);}
 }catch(e){
  if(e.name==='AbortError'){txt.textContent='Jawab rok diya gaya.';}
  else{state.messages=previous;txt.classList.add('err');txt.textContent='Error: '+e.message;status('bad','Backend se jawab nahi mila');}
 }
 setBusy(false);bottom();
}
sendBtn.addEventListener('click',()=>{if(state.busy){state.ctrl?.abort();return;}let t=ta.value;ta.value='';grow();setBusy(false);send(t);});
function grow(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,140)+'px';}
ta.addEventListener('input',()=>{grow();sendBtn.disabled=state.busy||!ta.value.trim();});
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendBtn.click();}});
$('#newChat').onclick=()=>{if(state.busy)state.ctrl?.abort();state.messages=[];$('#msgs').innerHTML='';chat.classList.remove('started');chat.scrollTop=0;if(window.speechSynthesis)speechSynthesis.cancel();};
$('#theme').onclick=()=>{let r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark';};
const wrap=$('#wrap');function close(){wrap.classList.remove('open');}
$('#gear').onclick=()=>{$('#fSys').value=state.system;$('#fSpeak').checked=state.speak;wrap.classList.add('open');};
$('#shClose').onclick=close;$('#scrim').onclick=close;$('#save').onclick=()=>{state.system=$('#fSys').value;state.speak=$('#fSpeak').checked;if(!state.speak&&window.speechSynthesis)speechSynthesis.cancel();close();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=$('#mic');
if(!SR){mic.hidden=true;}else{const rec=new SR();rec.lang='hi-IN';rec.interimResults=true;rec.continuous=false;rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;ta.value=t;grow();sendBtn.disabled=state.busy||!t.trim();};rec.onerror=()=>mic.classList.remove('on');rec.onend=()=>mic.classList.remove('on');mic.onclick=()=>{try{rec.start();mic.classList.add('on');}catch(e){}};}
if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
status('demo','Backend ready · message bhejein');
</script>
</body>
</html>
