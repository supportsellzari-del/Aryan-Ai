<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020810">

<title>JARVIS AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020810;
    color: #00eaff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    height: 100dvh;
    width: 100%;
    position: relative;
    background:
      radial-gradient(ellipse at center,
      #073642 0%, #03121d 48%, #020810 100%);
}

header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #00eaff55;
    background: #020d17;
    position: relative;
    z-index: 5;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 0 15px #00eaff;
}

.status {
    font-size: 12px;
    color: #00ffae;
}

.stage {
    position: absolute;
    top: 65px;
    bottom: 105px;
    width: 100%;
    overflow: hidden;
}

#avatar {
    position: absolute;
    inset: 0;
    z-index: 2;
}

#avatar canvas {
    width: 100%;
    height: 100%;
    display: block;
}

.grid {
    position: absolute;
    inset: 0;
    opacity: .15;
    background-image:
      linear-gradient(#00eaff44 1px, transparent 1px),
      linear-gradient(90deg,#00eaff44 1px,transparent 1px);
    background-size: 40px 40px;
}

.ring {
    position: absolute;
    width: min(75vw, 390px);
    aspect-ratio: 1;
    border: 1px solid #00eaff55;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 35px #00eaff22,
                inset 0 0 35px #00eaff22;
    animation: rotate 18s linear infinite;
    z-index: 1;
}

.ring::before {
    content: "";
    position: absolute;
    inset: 25px;
    border: 1px dashed #00eaff88;
    border-radius: 50%;
}

@keyframes rotate {
    to { transform: translate(-50%,-50%) rotate(360deg); }
}

.scan {
    position: absolute;
    width: 100%;
    height: 2px;
    background: #00eaff66;
    box-shadow: 0 0 15px #00eaff;
    animation: scan 6s linear infinite;
    z-index: 3;
    pointer-events: none;
}

@keyframes scan {
    from { top: 5%; }
    to { top: 95%; }
}

.label {
    position: absolute;
    bottom: 12px;
    width: 100%;
    text-align: center;
    letter-spacing: 4px;
    font-size: 12px;
    z-index: 4;
    pointer-events: none;
}

.info {
    position: absolute;
    top: 85px;
    left: 15px;
    z-index: 4;
    font-size: 10px;
    line-height: 2;
    color: #80dce5;
    pointer-events: none;
}

#message {
    position: absolute;
    bottom: 65px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    color: #a7eaf0;
    z-index: 5;
    padding: 5px;
}

.bottom {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 12px;
    background: #020810;
    border-top: 1px solid #00eaff44;
    z-index: 6;
}

.chat {
    display: flex;
    gap: 8px;
    max-width: 650px;
    margin: auto;
}

.chat input {
    flex: 1;
    min-width: 0;
    padding: 14px 18px;
    border-radius: 30px;
    border: 1px solid #00eaff77;
    background: #031b26;
    color: white;
    outline: none;
}

.chat button {
    border: 1px solid #00eaff;
    background: #003744;
    color: #00eaff;
    border-radius: 30px;
    padding: 0 22px;
}

@media(max-width:600px) {
    .ring {
        width: 80vw;
    }

    .info {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">JARVIS</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<div class="grid"></div>

<div class="info">
    AI CORE : ONLINE<br>
    AVATAR : LOADING<br>
    MODE : READY
</div>

<main class="stage">

    <div class="ring"></div>

    <div id="avatar"></div>

    <div class="scan"></div>

    <div class="label">
        JARVIS AI ASSISTANT
    </div>

</main>

<div id="message">
    Initializing JARVIS...
</div>

<div class="bottom">
    <div class="chat">
        <input id="chatInput"
               placeholder="Talk to JARVIS..."
               autocomplete="off">

        <button onclick="sendMessage()">SEND</button>
    </div>
</div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"three/addons/loaders/GLTFLoader.js";

import {
    VRMLoaderPlugin,
    VRMUtils
} from "@pixiv/three-vrm";


const container = document.getElementById("avatar");
const message = document.getElementById("message");

let vrm = null;
let head = null;

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    30, 1, 0.1, 100
);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);


// Lighting

scene.add(new THREE.HemisphereLight(
    0xffffff, 0x334455, 2
));

const light = new THREE.DirectionalLight(
    0xffffff, 3
);

light.position.set(1, 3, 4);
scene.add(light);


// Camera

camera.position.set(0, 1.25, 4.5);
camera.lookAt(0, 1.15, 0);


// Resize

function resize() {

    const width = container.clientWidth;
    const height = container.clientHeight;

    if (!width || !height) return;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

}

window.addEventListener("resize", resize);


// VRM Loader

const loader = new GLTFLoader();

loader.register(parser => {
    return new VRMLoaderPlugin(parser);
});

message.textContent = "Loading Female Avatar...";

loader.load(

    "./assets/models/viverse_avatar_model_202181.vrm",

    (gltf) => {

        vrm = gltf.userData.vrm;

        if (!vrm) {
            message.textContent = "VRM model not detected!";
            return;
        }

        // Support VRM 0.0 orientation
        VRMUtils.rotateVRM0(vrm);

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);

        // Fit model to screen
        const box = new THREE.Box3().setFromObject(vrm.scene);

        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const height = size.y || 2;

        const scale = 2.2 / height;

        vrm.scene.scale.setScalar(scale);

        vrm.scene.position.set(
            -center.x * scale,
            -box.min.y * scale,
            -center.z * scale
        );

        head = vrm.humanoid.getNormalizedBoneNode("head");

        resize();

        message.textContent =
            "JARVIS AVATAR SUCCESSFULLY LOADED";

        console.log("VRM Loaded:", vrm);

    },

    (progress) => {

        if (progress.total > 0) {

            const percent = Math.round(
                progress.loaded / progress.total * 100
            );

            message.textContent =
                "Loading Avatar: " + percent + "%";

        }

    },

    (error) => {

        console.error("VRM Loading Error:", error);

        message.textContent =
            "ERROR: " + (error.message || "Avatar Loading Failed");

    }

);


// Animation

const clock = new THREE.Clock();

let blinkTime = 0;
let nextBlink = 3;

function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (vrm) {

        const time = clock.elapsedTime;

        // Natural head movement
        if (head) {

            head.rotation.y =
                Math.sin(time * 0.6) * 0.035;

            head.rotation.x =
                Math.sin(time * 0.8) * 0.015;

        }

        // Eye blinking
        if (vrm.expressionManager) {

            blinkTime += delta;

            const phase = blinkTime % nextBlink;

            if (phase > nextBlink - 0.18) {

                const value = Math.sin(
                    Math.PI * (phase - (nextBlink - 0.18)) / 0.18
                );

                vrm.expressionManager.setValue(
                    "blink", Math.max(0, value)
                );

            } else {

                vrm.expressionManager.setValue("blink", 0);

            }

            if (blinkTime > nextBlink) {

                blinkTime = 0;
                nextBlink = 2.5 + Math.random() * 3;

            }

        }

        vrm.update(delta);

    }

    renderer.render(scene, camera);

}

resize();
animate();


// Future Lip Sync Control

window.jarvisLipSync = function(value) {

    if (!vrm || !vrm.expressionManager) return;

    vrm.expressionManager.setValue(
        "aa",
        Math.max(0, Math.min(1, value))
    );

};

window.jarvisStopLipSync = function() {
    window.jarvisLipSync(0);
};

</script>

<script>

function sendMessage() {

    const input = document.getElementById("chatInput");

    if (!input.value.trim()) return;

    document.getElementById("message").textContent =
        "AI Backend connection will be added next.";

    input.value = "";

}

document.getElementById("chatInput")
.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
