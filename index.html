<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>JARVIS</title>
<style>
:root{--c:#19e3ff;--b:#0a3cff;--bg:#02040c;--fx:41.5%;--fy:23.6%;--ey:19.6%;--by:17.6%}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:#cfefff;font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:minmax(200px,1fr) minmax(280px,1.2fr) minmax(240px,1.3fr);gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.p{border:1px solid #19e3ff66;border-radius:12px;background:#04102acc;box-shadow:0 0 18px #0a3cff55,inset 0 0 22px #0a3cff22;padding:12px;min-height:0;overflow:auto;position:relative}
.p h4{margin:0 0 8px;color:var(--c);font-weight:600;letter-spacing:.06em}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #19e3ff22;padding:5px 0;font-size:.95rem}.row b{color:#fff}
#left{display:flex;flex-direction:column;gap:12px}
#clock{font-size:2rem;color:#fff;text-shadow:0 0 12px var(--c)}
.bar{height:6px;background:#0a2a6a;border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .6s}
#stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;min-height:0}
#av{position:relative;height:calc(100% - 96px);max-height:640px;aspect-ratio:304/458;border-radius:18px;overflow:visible;transform-origin:50% 92%;animation:breathe 4s ease-in-out infinite;filter:drop-shadow(0 0 24px #0a3cffaa)}
#av .im{position:absolute;inset:0;border-radius:18px;overflow:hidden}#av img{width:100%;height:100%;display:block}
#hand{position:absolute;pointer-events:none;background-repeat:no-repeat;transform-origin:85% 85%;-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent);mask-image:radial-gradient(closest-side,#000 70%,transparent);opacity:0}
.speaking #hand{opacity:1;animation:hand 2.2s ease-in-out infinite}
.f{position:absolute;pointer-events:none;transition:all .35s}
#mouth{left:var(--fx);top:var(--fy);width:7%;height:1.3%;border-radius:50%;background:#031a3a;opacity:0;box-shadow:0 0 6px var(--c)}
#lids{left:calc(var(--fx) - 9%);top:var(--ey);width:25%;height:1.4%;background:#0a2a6a;opacity:0;border-radius:50%;filter:blur(1px)}
.brow{top:var(--by);width:8%;height:.5%;background:#7fe9ff;border-radius:3px;opacity:.55;box-shadow:0 0 5px var(--c)}
#bl{left:calc(var(--fx) - 6%)}#br{left:calc(var(--fx) + 3.5%)}
.blink #lids{animation:bl .17s}@keyframes bl{50%{opacity:.9}}
.curious .brow{transform:translateY(-3px) rotate(-5deg)}.sad .brow{transform:rotate(8deg)}.smile #mouth{border-radius:0 0 50% 50%;height:1.8%;opacity:.55}
.listening #av{animation:tilt 2.6s ease-in-out infinite}.thinking #av{animation:look 1.8s ease-in-out infinite}.speaking #av{animation:talk 1.9s ease-in-out infinite}.speaking #mouth{opacity:.9}
@keyframes breathe{50%{transform:scale(1.012)}}@keyframes tilt{50%{transform:rotate(1.4deg) translateX(3px)}}
@keyframes look{40%{transform:translateX(-5px) rotate(-1deg)}80%{transform:translateX(4px) rotate(.8deg)}}
@keyframes talk{25%{transform:rotate(.9deg) translateY(-2px)}75%{transform:rotate(-.9deg)}}
@keyframes hand{0%,100%{transform:rotate(-4deg) translateY(0)}40%{transform:rotate(7deg) translateY(-8px)}70%{transform:rotate(-2deg) translateY(-3px)}}
#wave{width:70%;max-width:300px;height:50px}#st{color:var(--c);font-size:1.25rem;text-shadow:0 0 10px var(--c);text-align:center;min-height:1.6em}
#right{display:flex;flex-direction:column;gap:12px;background:none;border:0;box-shadow:none;padding:0}
#card{flex:none;animation:pop .4s}#log{flex:1;min-height:90px}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
#log p{margin:.35em 0}.u{color:#8fb8ff}.j{color:#eaffff}.cur::after{content:"▌";animation:blk .7s infinite}@keyframes blk{50%{opacity:0}}
.big{font-size:2.4rem;color:#fff;text-shadow:0 0 12px var(--c)}.sp{display:inline-block;width:16px;height:16px;border:2px solid var(--c);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}
#txt{display:flex;gap:6px}#txt input{flex:1;background:#04102a;border:1px solid var(--c);border-radius:8px;color:#fff;padding:8px;font:inherit}#txt button,#start{font:inherit;background:var(--c);color:#021;border:0;border-radius:8px;padding:8px 14px}
#start{position:fixed;z-index:5;left:50%;bottom:28px;transform:translateX(-50%);font-size:1.2rem;border-radius:30px;padding:14px 30px;box-shadow:0 0 30px var(--c)}
@media(max-width:900px){main{grid-template-columns:1fr;grid-template-rows:auto;overflow:auto;height:auto;min-height:100%}html,body{overflow:auto}#stage{height:70vh;order:-1}#left{flex-direction:row;flex-wrap:wrap}#left .p{flex:1 1 150px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="gl"></canvas>
<main>
<section id="left"><div class="p"><h4>SYSTEM CLOCK</h4><div id="clock">--:--:--</div><div id="dt"></div></div>
<div class="p"><h4>INDICATORS</h4><div class="row"><span>State</span><b id="i-s">offline</b></div><div class="row"><span>Voice lang</span><b id="i-l">en-IN</b></div><div class="row"><span>Mic</span><b id="i-m">off</b></div><div class="row"><span>Network</span><b id="i-n">-</b></div><div class="row"><span>Backend</span><b id="i-b">idle</b></div><div class="row"><span>Last reply</span><b id="i-t">-</b></div></div>

</main>
<style id="solo">
html,body{overflow:hidden!important;background:radial-gradient(circle at 50% 35%,#07163a,#02040c 75%)}
#gl,#left,#right,#wave,#st{display:none!important}
main{display:block!important;height:100%!important;padding:0!important}
#stage{height:100%!important;justify-content:center!important}
#av{height:96%!important;max-height:none!important;max-width:100%}
#st.err{display:block!important;position:fixed;left:8px;right:8px;bottom:84px;z-index:6;background:#04102aee;border:1px solid #19e3ff;border-radius:10px;padding:8px;font-size:1rem}
</style>
<script>
// Character-only mode. Add ?hud=1 to the URL to bring back the panels.
if(/[?&]hud=1/.test(location.search))document.getElementById("solo").remove();
new MutationObserver(()=>{const e=document.getElementById("st");e.classList.toggle("err",/blocked|unsupported|unreachable|unavailable/i.test(e.textContent));}).observe(document.getElementById("st")||document.body,{childList:true,characterData:true,subtree:true});
</script>
<button id="start">Activate JARVIS</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== BACKEND ADAPTER: match to your existing working frontend =====
const BACKEND="https://aryan-ai-backend-v2.vercel.app/api/chat";
const buildBody=(msg,history)=>({message:msg});                                   // <- your request format
const readReply=d=>d.reply??d.response??d.message??d.text??d.answer??JSON.stringify(d); // <- your response field
// ====================================================================
const $=id=>document.getElementById(id),body=document.body,mobile=matchMedia("(max-width:900px)").matches;
const TTS=window.speechSynthesis||null,hasTTS=!!(TTS&&window.SpeechSynthesisUtterance);

let rec,lang="en-IN",state="idle",active=false,history=[],lastSpoken="",amp=0,listenUntil=0,lastWake=0,mood="",typer;
const setState=(s,t)=>{state=s;body.className=s+" "+mood;$("i-s").textContent=s;if(t)$("st").textContent=t;};
const setMood=m=>{mood=m;body.className=state+" "+mood;};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// ---------- face/hand overlay sizing ----------
function fit(){const a=$("av"),W=a.clientWidth,H=a.clientHeight,h=$("hand");
 Object.assign(h.style,{left:.06*W+"px",top:.32*H+"px",width:.3*W+"px",height:.3*H+"px",backgroundImage:"url(assets/jarvis.jpg)",backgroundSize:W+"px "+H+"px",backgroundPosition:`${-.06*W}px ${-.32*H}px`});}
addEventListener("resize",fit);addEventListener("load",fit);fit();
// ---------- blink / clock / power / net ----------
(function blink(){body.classList.add("blink");setTimeout(()=>body.classList.remove("blink"),180);setTimeout(blink,2500+Math.random()*3500);})();
setInterval(()=>{if(document.hidden)return;const n=new Date();$("clock").textContent=n.toLocaleTimeString();$("dt").textContent=n.toDateString();},1000);
const net=()=>{const c=navigator.connection||{};$("i-n").textContent=navigator.onLine?"online "+(c.effectiveType||""):"offline";};
addEventListener("online",net);addEventListener("offline",net);net();
if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{$("pw").textContent=Math.round(b.level*100)+"% "+(b.charging?"charging":"on battery");$("pb").style.width=b.level*100+"%";};u();b.onlevelchange=b.onchargingchange=u;});else $("pw").textContent="Not exposed by this browser";
// ---------- Three.js holographic background ----------
(function(){if(!window.THREE)return;const cv=$("gl"),r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:false});r.setPixelRatio(Math.min(devicePixelRatio,mobile?1.25:2));
const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1,.1,100);cam.position.set(0,1.2,6);cam.lookAt(0,-.4,0);
const N=mobile?250:700,pos=new Float32Array(N*3);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*14;pos[i*3+1]=(Math.random()-.5)*8;pos[i*3+2]=(Math.random()-.5)*10;}
const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(pos,3));const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0x19e3ff,size:.035,transparent:true,opacity:.8}));s.add(pts);
const rings=[1.6,2.2,2.9].map((rad,i)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(rad,.008,6,mobile?60:120),new THREE.MeshBasicMaterial({color:i?0x0a3cff:0x19e3ff,transparent:true,opacity:.6}));m.rotation.x=Math.PI/2.2;m.position.y=-2.2;s.add(m);return m;});
function rs(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}rs();addEventListener("resize",rs);
let last=0;(function loop(t){requestAnimationFrame(loop);if(document.hidden||t-last<(mobile?50:33))return;last=t;const k=state==="speaking"?2.5:state==="thinking"?4:state==="listening"?1.4:.6;
pts.rotation.y+=.0006*k;rings.forEach((m,i)=>m.rotation.z+=(i%2?-1:1)*.004*k*(i+1)*.6);r.render(s,cam);})(0);})();
// ---------- language / voice ----------
function detect(t){if(/[\u0980-\u09FF]/.test(t))return"bn-IN";if(/[\u0A80-\u0AFF]/.test(t))return"gu-IN";if(/[\u0900-\u097F]/.test(t))return"hi-IN";
 if(/\b(kya|hai|hain|ka|ki|ke|mujhe|batao|bata|kaise|nahi|aur|karo|kar|mausam|abhi|kitna|kitne|mera|tum|aap|chalo|khol|dikhao)\b/i.test(t))return"hinglish";return"en-IN";}
const vlang=l=>l==="hinglish"?"hi-IN":l;
function pickVoice(l){const v=TTS?TTS.getVoices():[],b=l.slice(0,2);return v.find(x=>x.lang.replace("_","-")===l)||v.find(x=>x.lang.startsWith(b))||null;}
let fake;
function speak(text,mo){if(TTS)TTS.cancel();clearTimeout(fake);lastSpoken=text.toLowerCase();if(mo)setMood(mo);
 const done=()=>{if(state==="speaking"){setMood("");listenUntil=Date.now()+9000;setState("listening","JARVIS is listening...");}};
 if(!hasTTS){setState("speaking","JARVIS (voice unavailable in this browser)");const iv=setInterval(()=>{amp=1;},260);fake=setTimeout(()=>{clearInterval(iv);done();},Math.min(text.length*55,15000));return;}
 const u=new SpeechSynthesisUtterance(text.replace(/[*#`]/g,""));u.lang=vlang(lang);const v=pickVoice(u.lang);if(v)u.voice=v;u.rate=1.02;
 u.onstart=()=>{setState("speaking","JARVIS is speaking...");};u.onboundary=()=>{amp=1};u.onend=u.onerror=done;TTS.speak(u);}
function wake(){if(Date.now()-lastWake<2500)return;lastWake=Date.now();if(TTS)TTS.cancel();clearTimeout(fake);clearInterval(typer);lang="en-IN";$("i-l").textContent=lang;setMood("smile");listenUntil=Date.now()+12000;setState("listening","JARVIS is listening...");speak("Yes Sir, I am listening.","smile");}
// ---------- mouth + waveform ----------
const cx=$("wave").getContext("2d");let ph=0;
setInterval(()=>{if(document.hidden)return;amp*=.8;ph+=.35;const sp=state==="speaking";
 if(!(mood==="smile"&&!sp))$("mouth").style.transform=`scaleY(${sp?.3+Math.abs(Math.sin(ph*2.1))*(.6+amp)*3:.25})`;
 cx.clearRect(0,0,300,50);cx.strokeStyle="#19e3ff";cx.lineWidth=2;cx.beginPath();const k=sp?18:state==="listening"?8:state==="thinking"?4:1.5;
 for(let x=0;x<=300;x+=4)cx.lineTo(x,25+Math.sin(x/13+ph)*k*Math.sin(x/300*Math.PI));cx.stroke();},mobile?50:33);
// ---------- UI output ----------
function showCard(title,icon,rows,extra=""){const c=$("card");c.style.animation="none";c.offsetHeight;c.style.animation="";
 c.innerHTML=`<h4>${icon} ${esc(title)}</h4>`+rows.map(r=>`<div class="row"><span>${r[0]}</span><b>${esc(String(r[1]))}</b></div>`).join("")+extra;}
function typeInto(el,text,cb){clearInterval(typer);let i=0;el.classList.add("cur");typer=setInterval(()=>{el.textContent=el.textContent.slice(0,0)+text.slice(0,++i);$("log").scrollTop=1e9;if(i>=text.length){clearInterval(typer);el.classList.remove("cur");cb&&cb();}},text.length>300?4:18);}
function logU(t){const p=document.createElement("p");p.className="u";p.textContent="You: "+t;$("log").append(p);}
function logJ(t){const p=document.createElement("p");p.className="j";$("log").append(p);typeInto(p,"JARVIS: "+t);}
const moodOf=t=>/\?$|\b(kya|which|what)\b/i.test(t)?"curious":/sorry|cannot|could not|error|offline|unable/i.test(t)?"sad":/great|welcome|happy|opening|searching|thank|sure/i.test(t)?"smile":"";
// ---------- automation modules ----------
const WMO=c=>c===0?["Clear sky","☀️"]:c<3?["Partly cloudy","⛅"]:c===3?["Overcast","☁️"]:c<50?["Fog","🌫️"]:c<68?["Rain","🌧️"]:c<78?["Snow","❄️"]:c<83?["Showers","🌦️"]:["Thunderstorm","⛈️"];
async function weather(city){setState("thinking",`Searching ${city} weather...`);showCard(city+" WEATHER","🌐",[],'<span class="sp"></span> Fetching live data…');
 const g=await(await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(city))).json();if(!g.results)return`Sir, I could not find a place called ${city}.`;
 const p=g.results[0],w=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`)).json()).current,[cond,ic]=WMO(w.weather_code);
 showCard(p.name.toUpperCase()+" WEATHER",ic,[["Temperature",w.temperature_2m+" °C"],["Condition",cond],["Humidity",w.relative_humidity_2m+"%"],["Wind speed",w.wind_speed_10m+" km/h"]],`<div class="big">${ic} ${w.temperature_2m}°</div>`);
 return`Sir, ${p.name} is ${w.temperature_2m} degrees Celsius, ${cond}, humidity ${w.relative_humidity_2m} percent, wind ${w.wind_speed_10m} kilometres per hour.`;}
const SITES={youtube:"youtube.com",google:"google.com",github:"github.com",wikipedia:"wikipedia.org",gmail:"mail.google.com",maps:"maps.google.com",whatsapp:"web.whatsapp.com",instagram:"instagram.com",facebook:"facebook.com",linkedin:"linkedin.com",netflix:"netflix.com"};
const MODULES=[ // add future automations here: {test:(t)=>match|null, run:async(match,t)=>reply}
{test:t=>{if(!/weather|mausam|मौसम/.test(t))return null;const m=t.match(/(?:weather|mausam)\s+(?:in|of|at|for)\s+([\p{L} ]+?)(?:\s+(?:today|now|abhi|kya))?$/u)||t.match(/([\p{L}]+)\s+(?:ka|ki|ke)\s+(?:weather|mausam)/u)||t.match(/([\p{L}]+)\s+weather/u);return m&&!/^(the|what|whats|current|today)$/.test(m[1])?m[1]:null;},run:weather},
{test:t=>/\b(time|date|day today|samay|tarikh|what day)\b/.test(t),run:async()=>{const n=new Date();showCard("TIME & DATE","🕒",[["Time",n.toLocaleTimeString()],["Date",n.toDateString()],["Zone",Intl.DateTimeFormat().resolvedOptions().timeZone]]);return`Sir, it is ${n.toLocaleTimeString()} on ${n.toDateString()}.`;}},
{test:t=>/battery/.test(t),run:async()=>{if(!navigator.getBattery)return"Sir, this browser does not expose battery information.";const b=await navigator.getBattery(),p=Math.round(b.level*100);showCard("BATTERY","🔋",[["Level",p+"%"],["Charging",b.charging?"Yes":"No"]],`<div class="bar"><i style="width:${p}%"></i></div>`);return`Battery is at ${p} percent${b.charging?" and charging":""}, Sir.`;}},
{test:t=>/internet|network|wifi|online/.test(t),run:async()=>{const c=navigator.connection||{};showCard("INTERNET","📡",[["Status",navigator.onLine?"Online":"Offline"],["Type",c.effectiveType||"n/a"],["Downlink",c.downlink?c.downlink+" Mbps":"n/a"],["Latency",c.rtt?c.rtt+" ms":"n/a"]]);return navigator.onLine?"You are online, Sir.":"You appear to be offline, Sir.";}},
{test:t=>/system (info|information)|device info/.test(t),run:async()=>{showCard("SYSTEM","💻",[["CPU threads",navigator.hardwareConcurrency||"n/a"],["Memory",(navigator.deviceMemory||"n/a")+" GB"],["Platform",navigator.platform||"n/a"],["Screen",screen.width+"×"+screen.height],["Language",navigator.language]]);return"Here is your system information, Sir.";}},
{test:t=>t.match(/(?:youtube(?: pe| par)?(?: search| mein)?|search youtube for|play)\s+(?:for\s+)?(.+)/),run:async m=>{const q=m[1].replace(/\s+(on|pe|par)\s+youtube$/,"");open("https://www.youtube.com/results?search_query="+encodeURIComponent(q),"_blank");showCard("YOUTUBE SEARCH","▶️",[["Query",q]]);return`Searching YouTube for ${q}, Sir.`;}},
{test:t=>t.match(/(?:google|search(?: for)?)\s+(.+)/),run:async m=>{open("https://www.google.com/search?q="+encodeURIComponent(m[1]),"_blank");showCard("GOOGLE SEARCH","🔎",[["Query",m[1]]]);return`Searching Google for ${m[1]}, Sir.`;}},
{test:t=>{const m=t.match(/(?:open|khol|kholo)\s+(\w+)/);return m&&SITES[m[1]]?m[1]:null;},run:async s=>{open("https://"+SITES[s],"_blank");showCard("OPENING","🌐",[["Site",SITES[s]]]);return`Opening ${s}, Sir.`;}}];
async function local(q){const t=q.toLowerCase();for(const m of MODULES){const r=m.test(t);if(r)return await m.run(r===true?t:r,t);}return null;}
// ---------- ask ----------
async function ask(q){clearInterval(typer);setMood("curious");setState("thinking","JARVIS is thinking...");logU(q);history.push({role:"user",content:q});const t0=performance.now();let reply;
 try{reply=await local(q);}catch(e){reply="Sir, I could not fetch that live data right now.";}
 if(!reply){$("card").innerHTML='<h4>🧠 JARVIS</h4><span class="sp"></span> Consulting my AI core…';$("i-b").textContent="calling";
  try{const r=await fetch(BACKEND,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildBody(q,history))});if(!r.ok)throw new Error(r.status);reply=readReply(await r.json());$("i-b").textContent="ok";$("card").innerHTML=`<h4>🧠 ANSWER</h4><span style="color:#8fb8ff">${esc(q)}</span>`;}
  catch(e){$("i-b").textContent="error";reply="Sir, I cannot reach my backend right now. Please check the connection.";$("card").innerHTML="<h4>⚠️ CONNECTION</h4>Backend unreachable. I will keep trying on your next request.";}}
 $("i-t").textContent=Math.round(performance.now()-t0)+" ms";history.push({role:"assistant",content:reply});if(history.length>30)history=history.slice(-30);
 logJ(reply);speak(reply,moodOf(reply)||"");}
// ---------- hands-free recognition ----------
function listen(){rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=vlang(lang);
 rec.onstart=()=>$("i-m").textContent="on";
 rec.onresult=e=>{const r=e.results[e.results.length-1],t=r[0].transcript.trim(),low=t.toLowerCase(),hasWake=/\bjarvis\b|जार्विस|જાર્વિસ|জার্ভিস/.test(low);
  if(state==="speaking"){if(hasWake&&!lastSpoken.includes(low.replace(/\s+/g," ")))wake();return;} // interrupt; ignore own voice
  if(!r.isFinal)return;const q=t.replace(/^(hey|ok|okay)?\s*(jarvis|जार्विस)[,.\s]*/i,"").trim();
