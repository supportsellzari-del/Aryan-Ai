<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Virtual Assistant</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020916;
    font-family: Arial, sans-serif;
}

/* BACKGROUND */

#background {
    position: fixed;
    inset: 0;

    background:
        linear-gradient(
            rgba(1, 8, 25, 0.25),
            rgba(1, 8, 25, 0.45)
        ),
        url("./assets/background/command-center.jpg");

    background-size: cover;
    background-position: center;
    z-index: 0;
}

/* DARK OVERLAY */

#overlay {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0, 5, 18, 0.5) 100%
        );

    z-index: 1;
    pointer-events: none;
}

/* HOLOGRAM LIGHT */

.hologram {
    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    border: 1px solid rgba(0, 200, 255, 0.15);

    box-shadow:
        0 0 30px rgba(0, 180, 255, 0.08),
        inset 0 0 40px rgba(0, 180, 255, 0.05);

    animation: hologramPulse 5s infinite alternate;

    z-index: 2;
    pointer-events: none;
}

.hologram.left {
    left: -180px;
    top: 25%;
}

.hologram.right {
    right: -180px;
    top: 25%;
}

@keyframes hologramPulse {

    from {
        opacity: 0.25;
        transform: scale(0.9);
    }

    to {
        opacity: 0.7;
        transform: scale(1.1);
    }

}

/* AVATAR */

#avatarContainer {

    position: fixed;

    left: 50%;
    bottom: 0;

    transform: translateX(-50%);

    width: 100%;
    height: 100%;

    z-index: 5;

    pointer-events: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* VOICE VISUALIZER */

#voiceGlow {

    position: fixed;

    width: 260px;
    height: 260px;

    left: 50%;
    bottom: -150px;

    transform: translateX(-50%);

    border-radius: 50%;

    background: rgba(0, 180, 255, 0.2);

    filter: blur(70px);

    opacity: 0;

    transition: opacity 0.4s;

    z-index: 3;

}

body.speaking #voiceGlow {
    opacity: 1;
}

/* RESPONSIVE */

@media (max-width: 600px) {

    #background {
        background-position: center;
    }

    .hologram {
        width: 180px;
        height: 180px;
    }

}

@media (min-width: 900px) {

    #avatarContainer {
        width: 65%;
    }

}

</style>

</head>

<body>

<div id="background"></div>

<div id="overlay"></div>

<div class="hologram left"></div>
<div class="hologram right"></div>

<div id="avatarContainer"></div>

<div id="voiceGlow"></div>


<script type="importmap">

{
    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

        "@pixiv/three-vrm":
        "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"

    }
}

</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";


/* =====================================
   CONFIGURATION
===================================== */

const MODEL_PATH =
"./assets/models/lady_avatar_v3.vrm";

const API_URL =
"https://aryan-ai-backend-v2.vercel.app/api/chat";

const CHARACTER = "AIRA";

const LANGUAGE = "en-IN";


/* =====================================
   THREE JS SETUP
===================================== */

const container =
document.getElementById("avatarContainer");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
35,
window.innerWidth / window.innerHeight,
0.1,
100
);

camera.position.set(0, 1.35, 2.8);


const renderer = new THREE.WebGLRenderer({

    alpha: true,

    antialias: true,

    powerPreference: "high-performance"

});

renderer.setPixelRatio(
Math.min(window.devicePixelRatio, 1.7)
);

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);


/* =====================================
   LIGHTING
===================================== */

const ambientLight = new THREE.AmbientLight(
0xffffff,
1.5
);

scene.add(ambientLight);


const frontLight = new THREE.DirectionalLight(
0xffffff,
2.5
);

frontLight.position.set(0, 3, 5);

scene.add(frontLight);


const blueLight = new THREE.PointLight(
0x00bfff,
30,
10
);

blueLight.position.set(-2, 2, 2);

scene.add(blueLight);


const purpleLight = new THREE.PointLight(
0x6b4cff,
20,
10
);

purpleLight.position.set(2, 1, -2);

scene.add(purpleLight);


/* =====================================
   VRM MODEL
===================================== */

let currentVRM = null;

let headBone = null;

let neckBone = null;

let chestBone = null;

let leftArm = null;

let rightArm = null;

let expressionManager = null;

let modelReady = false;


const loader = new GLTFLoader();

loader.register((parser) => {

    return new VRMLoaderPlugin(parser);

});


loader.load(

MODEL_PATH,

(gltf) => {

    const vrm = gltf.userData.vrm;

    currentVRM = vrm;

    VRMUtils.removeUnnecessaryVertices(
        gltf.scene
    );

    VRMUtils.removeUnnecessaryJoints(
        gltf.scene
    );

    scene.add(vrm.scene);


    /* HUMANOID BONES */

    const humanoid = vrm.humanoid;

    headBone = humanoid.getNormalizedBoneNode(
        "head"
    );

    neckBone = humanoid.getNormalizedBoneNode(
        "neck"
    );

    chestBone = humanoid.getNormalizedBoneNode(
        "chest"
    );

    leftArm = humanoid.getNormalizedBoneNode(
        "leftUpperArm"
    );

    rightArm = humanoid.getNormalizedBoneNode(
        "rightUpperArm"
    );


    expressionManager =
    vrm.expressionManager;


    /* MODEL POSITION */

    vrm.scene.position.set(
        0,
        -1.0,
        0
    );

    vrm.scene.rotation.y = Math.PI;


    modelReady = true;

    console.log("VRM Loaded Successfully");


    /* CAMERA HALF BODY */

    camera.position.set(
        0,
        1.35,
        2.8
    );

},

undefined,

(error) => {

    console.error("VRM Loading Error:", error);

}

);


/* =====================================
   NATURAL ANIMATION
===================================== */

const clock = new THREE.Clock();

let talking = false;

let blinkValue = 0;

let nextBlink = 3;

let blinkTimer = 0;

let animationTime = 0;


function animateAvatar() {

    requestAnimationFrame(animateAvatar);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    animationTime += delta;


    if (currentVRM && modelReady) {

        /* BREATHING */

        const breathing =
        Math.sin(animationTime * 1.5) * 0.008;

        currentVRM.scene.position.y =
        -1.0 + breathing;


        /* HEAD MOVEMENT */

        if (headBone) {

            headBone.rotation.y =
            Math.sin(animationTime * 0.5) * 0.035;

            headBone.rotation.x =
            Math.sin(animationTime * 0.8) * 0.018;

        }


        /* NECK MOVEMENT */

        if (neckBone) {

            neckBone.rotation.x =
            Math.sin(animationTime * 0.7) * 0.01;

        }


        /* BLINKING */

        blinkTimer += delta;

        if (blinkTimer > nextBlink) {

            blinkValue = 1;

            nextBlink =
            0.12 + Math.random() * 0.08;

            blinkTimer = -0.15;

        }

        if (blinkValue > 0) {

            blinkValue -= delta * 7;

            if (blinkValue < 0) {
                blinkValue = 0;
            }

        }


        if (expressionManager) {

            expressionManager.setValue(
                "blink",
                blinkValue
            );

        }


        /* SPEAKING MOUTH ANIMATION */

        if (talking && expressionManager) {

            const mouth =
            0.2 +
            Math.abs(Math.sin(animationTime * 13)) * 0.45;

            expressionManager.setValue(
                "aa",
                mouth
            );

        } else if (expressionManager) {

            expressionManager.setValue(
                "aa",
                0
            );

        }


        /* AUTOMATIC HAND GESTURE */

        if (leftArm && rightArm) {

            const gesture =
            talking ? 0.08 : 0.015;

            leftArm.rotation.z =
            0.12 + Math.sin(animationTime * 1.4) * gesture;

            rightArm.rotation.z =
            -0.12 - Math.sin(animationTime * 1.4) * gesture;

        }


        currentVRM.update(delta);

    }

    renderer.render(scene, camera);

}

animateAvatar();


/* =====================================
   RESIZE
===================================== */

window.addEventListener(
"resize",
() => {

    camera.aspect =
    window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.7)
    );

});


/* =====================================
   AI CHAT BACKEND
===================================== */

let conversation = [];

async function sendToAI(message) {

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify({

                message: message,

                messages: conversation,

                character: CHARACTER,

                language: LANGUAGE

            })

        });


        if (!response.ok) {

            throw new Error(
                "Backend Error: " + response.status
            );

        }


        const data = await response.json();

        if (!data.success || !data.reply) {

            throw new Error(
                "Invalid AI response"
            );

        }


        conversation.push({

            role: "user",

            content: message

        });

        conversation.push({

            role: "assistant",

            content: data.reply

        });


        if (conversation.length > 20) {

            conversation =
            conversation.slice(-20);

        }


        speakResponse(data.reply);

    }

    catch(error) {

        console.error("AI Error:", error);

        speakResponse(
            "Sorry, I am having trouble connecting. Please try again."
        );

    }

}


/* =====================================
   TEXT TO SPEECH
===================================== */

function speakResponse(text) {

    if (!("speechSynthesis" in window)) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
    new SpeechSynthesisUtterance(text);

    utterance.lang = LANGUAGE;

    utterance.rate = 1;

    utterance.pitch = 1.05;

    utterance.volume = 1;


    utterance.onstart = () => {

        talking = true;

        document.body.classList.add(
            "speaking"
        );

    };


    utterance.onend = () => {

        talking = false;

        document.body.classList.remove(
            "speaking"
        );

    };


    utterance.onerror = () => {

        talking = false;

        document.body.classList.remove(
            "speaking"
        );

    };


    speechSynthesis.speak(utterance);

}


/* =====================================
   SPEECH RECOGNITION
===================================== */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition = null;

let recognitionActive = false;

let restartTimer = null;


if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = LANGUAGE;

    recognition.continuous = true;

    recognition.interimResults = false;


    recognition.onstart = () => {

        recognitionActive = true;

        console.log("Microphone Listening");

    };


    recognition.onresult = (event) => {

        const result =
        event.results[event.results.length - 1];

        if (!result.isFinal) {
            return;
        }

        const message =
        result[0].transcript.trim();

        if (!message) {
            return;
        }

        console.log("User:", message);

        speechSynthesis.cancel();

        talking = false;

        sendToAI(message);

    };


    recognition.onerror = (event) => {

        console.log(
            "Speech Recognition Error:",
            event.error
        );

    };


    recognition.onend = () => {

        recognitionActive = false;

        clearTimeout(restartTimer);

        restartTimer = setTimeout(
            startListening,
            1000
        );

    };

}


/* =====================================
   AUTOMATIC MICROPHONE
===================================== */

async function startListening() {

    if (!recognition) {

        console.error(
            "Speech Recognition is not supported in this browser."
        );

        return;

    }

    if (recognitionActive) {
        return;
    }

    try {

        await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        recognition.start();

    }

    catch(error) {

        console.error(
            "Microphone Permission Error:",
            error
        );

    }

}


/* =====================================
   AUTOMATIC START
===================================== */

window.addEventListener(
"load",
() => {

    setTimeout(() => {

        startListening();

    }, 1500);

});


/* =====================================
   CLEANUP
===================================== */

window.addEventListener(
"beforeunload",
() => {

    clearTimeout(restartTimer);

    if (recognition) {

        recognition.stop();

    }

    speechSynthesis.cancel();

});

</script>

</body>
</html>
