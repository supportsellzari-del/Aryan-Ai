<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AI Virtual Assistant</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020817;
    font-family: Arial, sans-serif;
}

body {
    position: relative;
}

/* BACKGROUND */

#background {
    position: fixed;
    inset: 0;
    z-index: 0;

    background:
        linear-gradient(
            rgba(0, 5, 20, 0.15),
            rgba(0, 5, 20, 0.35)
        ),
        url("./assets/background/command-center.jpg");

    background-size: cover;
    background-position: center center;
}

/* DARK CINEMATIC OVERLAY */

#overlay {
    position: fixed;
    inset: 0;
    z-index: 1;

    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0, 5, 20, 0.35) 100%
        );

    pointer-events: none;
}

/* HOLOGRAPHIC LIGHT */

.light {
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;

    filter: blur(90px);

    pointer-events: none;
    z-index: 2;

    opacity: 0.35;

    animation: lightMove 6s ease-in-out infinite alternate;
}

.light1 {
    background: #008cff;
    left: -120px;
    top: 25%;
}

.light2 {
    background: #00eaff;
    right: -120px;
    top: 45%;
    animation-delay: 2s;
}

@keyframes lightMove {
    from {
        transform: scale(0.8);
        opacity: 0.2;
    }

    to {
        transform: scale(1.2);
        opacity: 0.5;
    }
}

/* AVATAR CANVAS */

#avatarContainer {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

#avatarContainer canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* SPEAKING LIGHT */

#voiceGlow {
    position: fixed;

    width: 300px;
    height: 200px;

    left: 50%;
    bottom: -120px;

    transform: translateX(-50%);

    background: #00bfff;

    filter: blur(90px);

    opacity: 0;

    transition: opacity 0.4s;

    z-index: 3;
    pointer-events: none;
}

body.speaking #voiceGlow {
    opacity: 0.65;
}

/* RESPONSIVE */

@media (max-width: 600px) {

    #background {
        background-position: center center;
    }

}

</style>

</head>

<body>

<div id="background"></div>
<div id="overlay"></div>

<div class="light light1"></div>
<div class="light light2"></div>

<div id="avatarContainer"></div>
<div id="voiceGlow"></div>


<script type="importmap">

{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
    }
}

</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

import {
    VRMLoaderPlugin,
    VRMUtils
} from "@pixiv/three-vrm";


/* =====================================
   CONFIGURATION
===================================== */

const MODEL_PATH =
"./assets/models/lady_avatar_v3.vrm";

const API_URL =
"https://aryan-ai-backend-v2.vercel.app/api/chat";


/* =====================================
   SCENE
===================================== */

const container =
document.getElementById("avatarContainer");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
28,
window.innerWidth / window.innerHeight,
0.01,
100
);


const renderer = new THREE.WebGLRenderer({

    alpha: true,
    antialias: true,
    powerPreference: "high-performance"

});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
THREE.SRGBColorSpace;

renderer.toneMapping =
THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.2;

container.appendChild(renderer.domElement);


/* =====================================
   LIGHTING
===================================== */

scene.add(
    new THREE.AmbientLight(0xffffff, 1.7)
);


const frontLight =
new THREE.DirectionalLight(0xffffff, 2.5);

frontLight.position.set(0, 3, 5);

scene.add(frontLight);


const blueLight =
new THREE.PointLight(0x00bfff, 35, 10);

blueLight.position.set(-2, 2, 2);

scene.add(blueLight);


const purpleLight =
new THREE.PointLight(0x5555ff, 20, 10);

purpleLight.position.set(2, 2, -2);

scene.add(purpleLight);


/* =====================================
   VRM VARIABLES
===================================== */

let currentVRM = null;

let headBone = null;
let neckBone = null;

let leftArm = null;
let rightArm = null;

let expressionManager = null;

let modelReady = false;

let modelHeight = 1;


/* =====================================
   CAMERA AUTO FRAMING
===================================== */

function frameAvatar(vrm) {

    const model = vrm.scene;

    model.updateMatrixWorld(true);

    const box = new THREE.Box3()
        .setFromObject(model);

    const size = new THREE.Vector3();

    const center = new THREE.Vector3();

    box.getSize(size);

    box.getCenter(center);

    if (
        !Number.isFinite(size.y) ||
        size.y <= 0.001
    ) {

        console.error("Invalid VRM model dimensions");

        return;

    }

    modelHeight = size.y;

    // Move model to centre horizontally

    model.position.x -= center.x;

    model.position.z -= center.z;

    // Put model feet at zero

    model.position.y -= box.min.y;

    model.updateMatrixWorld(true);

    /*
       Half-body framing.

       Camera target is positioned
       around upper torso.

       This keeps face and waist visible.
    */

    const targetY = modelHeight * 0.72;

    const distance = modelHeight * 1.40;

    camera.position.set(
        0,
        targetY,
        distance
    );

    camera.lookAt(
        0,
        targetY,
        0
    );

    camera.near = 0.01;

    camera.far = modelHeight * 20;

    camera.updateProjectionMatrix();

    console.log("VRM Height:", modelHeight);

    console.log("Camera framed successfully");

}


/* =====================================
   LOAD VRM
===================================== */

const loader = new GLTFLoader();

loader.register((parser) => {

    return new VRMLoaderPlugin(parser);

});


loader.load(

    MODEL_PATH,

    (gltf) => {

        const vrm = gltf.userData.vrm;

        if (!vrm) {

            console.error("VRM data missing");

            return;

        }

        currentVRM = vrm;

        VRMUtils.removeUnnecessaryVertices(
            gltf.scene
        );

        VRMUtils.removeUnnecessaryJoints(
            gltf.scene
        );

        scene.add(vrm.scene);

        /*
           Keep the model facing camera.
           If your model faces backwards,
           change Math.PI to 0.
        */

        vrm.scene.rotation.y = Math.PI;

        // AUTO CAMERA FRAMING

        frameAvatar(vrm);


        // HUMANOID BONES

        const humanoid = vrm.humanoid;

        headBone =
        humanoid.getNormalizedBoneNode("head");

        neckBone =
        humanoid.getNormalizedBoneNode("neck");

        leftArm =
        humanoid.getNormalizedBoneNode("leftUpperArm");

        rightArm =
        humanoid.getNormalizedBoneNode("rightUpperArm");

        expressionManager =
        vrm.expressionManager;


        modelReady = true;

        console.log("AIRA VRM Loaded Successfully");

    },

    (progress) => {

        if (progress.total > 0) {

            console.log(
                "Loading:",
                Math.round(
                    progress.loaded / progress.total * 100
                ) + "%"
            );

        }

    },

    (error) => {

        console.error(
            "VRM Loading Failed:",
            error
        );

    }

);


/* =====================================
   ANIMATION
===================================== */

const clock = new THREE.Clock();

let animationTime = 0;

let blinkTimer = 0;

let blinkValue = 0;

let nextBlink = 3;

let talking = false;


function animate() {

    requestAnimationFrame(animate);

    const delta = Math.min(
        clock.getDelta(),
        0.05
    );

    animationTime += delta;


    if (currentVRM && modelReady) {

        // BREATHING

        currentVRM.scene.position.y +=
            Math.sin(animationTime * 1.5) * 0.0008;


        // NATURAL HEAD MOVEMENT

        if (headBone) {

            headBone.rotation.y =
                Math.sin(animationTime * 0.5) * 0.035;

            headBone.rotation.x =
                Math.sin(animationTime * 0.7) * 0.015;

        }


        // NECK

        if (neckBone) {

            neckBone.rotation.x =
                Math.sin(animationTime * 0.6) * 0.01;

        }


        // BLINKING

        blinkTimer += delta;

        if (blinkTimer >= nextBlink) {

            blinkValue = 1;

            blinkTimer = 0;

            nextBlink =
                2 + Math.random() * 3;

        }

        if (blinkValue > 0) {

            blinkValue -= delta * 8;

            blinkValue = Math.max(
                0,
                blinkValue
            );

        }


        if (expressionManager) {

            expressionManager.setValue(
                "blink",
                blinkValue
            );


            // TALKING

            if (talking) {

                const mouth =
                    0.15 +
                    Math.abs(
                        Math.sin(animationTime * 12)
                    ) * 0.45;

                expressionManager.setValue(
                    "aa",
                    mouth
                );

            } else {

                expressionManager.setValue(
                    "aa",
                    0
                );

            }

        }


        // SUBTLE ARM MOVEMENT

        if (leftArm && rightArm) {

            const movement =
                talking ? 0.035 : 0.008;

            leftArm.rotation.z =
                movement * Math.sin(animationTime * 1.5);

            rightArm.rotation.z =
                -movement * Math.sin(animationTime * 1.5);

        }


        currentVRM.update(delta);

    }

    renderer.render(scene, camera);

}

animate();


/* =====================================
   RESIZE
===================================== */

function resize() {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    // Recalculate framing after orientation change

    if (currentVRM) {

        frameAvatar(currentVRM);

    }

}

window.addEventListener("resize", resize);


/* =====================================
   AI BACKEND
===================================== */

let conversation = [];

async function sendToAI(message) {

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {

                "Content-Type": "application/json"

            },

            body: JSON.stringify({

                message: message,

                messages: conversation,

                character: "assistant",

                language: "hinglish"

            })

        });


        if (!response.ok) {

            throw new Error(
                "API Error: " + response.status
            );

        }


        const data = await response.json();

        if (!data.success || !data.reply) {

            throw new Error("Invalid AI response");

        }


        conversation.push({

            role: "user",

            content: message

        });

        conversation.push({

            role: "assistant",

            content: data.reply

        });


        if (conversation.length > 20) {

            conversation =
                conversation.slice(-20);

        }


        speak(data.reply);

    }

    catch(error) {

        console.error("AI Error:", error);

        speak(
            "Sorry, connection mein problem aa rahi hai."
        );

    }

}


/* =====================================
   TEXT TO SPEECH
===================================== */

function speak(text) {

    if (!window.speechSynthesis) {
        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "hi-IN";

    utterance.rate = 1;

    utterance.pitch = 1.05;

    utterance.volume = 1;


    utterance.onstart = () => {

        talking = true;

        document.body.classList.add("speaking");

        if (recognition) {

            try {
                recognition.stop();
            } catch(e) {}

        }

    };


    utterance.onend = () => {

        talking = false;

        document.body.classList.remove("speaking");

        setTimeout(
            startListening,
            700
        );

    };


    utterance.onerror = () => {

        talking = false;

        document.body.classList.remove("speaking");

        setTimeout(
            startListening,
            1000
        );

    };


    speechSynthesis.speak(utterance);

}


/* =====================================
   SPEECH RECOGNITION
===================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let recognitionActive = false;


if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";

    recognition.continuous = true;

    recognition.interimResults = false;


    recognition.onstart = () => {

        recognitionActive = true;

        console.log("Listening...");

    };


    recognition.onresult = (event) => {

        const result =
            event.results[event.results.length - 1];

        if (!result.isFinal) {
            return;
        }

        const message =
            result[0].transcript.trim();

        if (!message) {
            return;
        }

        console.log("User:", message);

        sendToAI(message);

    };


    recognition.onerror = (event) => {

        console.log(
            "Microphone:",
            event.error
        );

    };


    recognition.onend = () => {

        recognitionActive = false;

        if (!talking) {

            setTimeout(
                startListening,
                1000
            );

        }

    };

}


/* =====================================
   START LISTENING
===================================== */

async function startListening() {

    if (!recognition) {

        console.error(
            "Speech recognition unsupported"
        );

        return;

    }

    if (recognitionActive || talking) {
        return;
    }

    try {

        await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        recognition.start();

    }

    catch(error) {

        console.error(
            "Microphone Permission:",
            error
        );

    }

}


/* =====================================
   START
===================================== */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            startListening,
            1500
        );

    }
);


/* =====================================
   CLEANUP
===================================== */

window.addEventListener(
    "beforeunload",
    () => {

        if (recognition) {

            recognition.stop();

        }

        speechSynthesis.cancel();

    }
);

</script>

</body>
</html>
