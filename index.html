<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#050B25">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aryan AI">
<meta name="description" content="Aryan AI - Your Smart AI Assistant">
<title>Aryan AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23087CFF'/%3E%3Cpath d='M32 14 18 50h8l3-8h6l3 8h8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050B25; --bg2:#081338; --chat:#0B1740; --card:#0E1D4D; --line:rgba(53,232,255,.16);
  --text:#F5F8FF; --muted:#9BA9D6; --blue:#087CFF; --cyan:#35E8FF; --danger:#FF5C7A; --ok:#3DDC97;
  --user-bubble:linear-gradient(135deg,#087CFF,#0A5FE0);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --app-h:100dvh;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --display:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Devanagari',sans-serif;
}
[data-theme="midnight"]{--bg:#02050F;--bg2:#040A1E;--chat:#071030;--card:#0A1640;--line:rgba(53,232,255,.12)}
[data-theme="light"]{--bg:#EAF1FF;--bg2:#F6F9FF;--chat:#FFFFFF;--card:#FFFFFF;--line:rgba(8,124,255,.18);--text:#0A1535;--muted:#5A6A98;--shadow:0 10px 30px rgba(8,60,160,.12);--cyan:#0AA5C2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

#app{position:relative;width:100%;max-width:480px;height:var(--app-h);margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);overflow:hidden}
@media (min-width:520px){
  body{background:radial-gradient(circle at 50% 0%,#0b2a7a 0%,#02050F 70%)}
  [data-theme="light"] body{background:#d7e4ff}
  #app{height:min(var(--app-h),900px);margin-top:max(0px,calc((var(--app-h) - 900px)/2));border-radius:28px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(8,124,255,.18)}
}

/* Header */
.header{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) calc(var(--sar) + 16px) 10px calc(var(--sal) + 16px)}
.logo{flex:none;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;box-shadow:0 0 18px rgba(53,232,255,.45)}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1.15}
.brand p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--cyan);color:var(--cyan);background:rgba(53,232,255,.08)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--text);transition:transform .15s,background .15s}
.icon-btn:active{transform:scale(.92)}
.avatar{background:linear-gradient(135deg,#0A5FE0,#35E8FF);border:0;font-family:var(--display);font-weight:700;font-size:15px;color:#031030}

/* Screens */
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.active{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px calc(var(--sar) + 16px) 16px calc(var(--sal) + 16px);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.screen-title{font-family:var(--display);font-size:22px;font-weight:700;margin:6px 0 4px}
.screen-sub{color:var(--muted);font-size:13px;margin-bottom:14px}

/* Chat bar */
.chatbar{flex:none;display:flex;align-items:center;gap:8px;padding:0 calc(var(--sar) + 16px) 6px calc(var(--sal) + 16px)}
.chatbar .title{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--text)}
.pill-btn.primary{background:linear-gradient(135deg,var(--blue),#0A5FE0);border-color:transparent;color:#fff}
.pill-btn.danger{color:var(--danger);border-color:rgba(255,92,122,.4)}

/* Hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 8px}
.robot-wrap{position:relative;width:min(62vw,230px);aspect-ratio:240/260;max-height:30vh;margin-bottom:6px}
.robot-wrap svg{width:100%;height:100%;overflow:visible}
.hero h2{font-family:var(--display);font-size:clamp(20px,6vw,26px);font-weight:700;line-height:1.2}
.hero h2 span{color:var(--cyan)}
.hero p{color:var(--muted);font-size:13.5px;max-width:300px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{padding:9px 14px;border-radius:14px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--text);text-align:left;transition:border-color .15s,transform .15s}
.chip:active{transform:scale(.96);border-color:var(--cyan)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.r-float{animation:float 4.5s ease-in-out infinite}
.r-ring1{transform-origin:120px 130px;animation:spin 26s linear infinite}
.r-ring2{transform-origin:120px 130px;animation:spin 40s linear infinite reverse}
.r-eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.r-ant{animation:pulse 1.8s ease-in-out infinite}
.r-dot{animation:twinkle 3s ease-in-out infinite}

/* Messages */
.msgs{display:flex;flex-direction:column;gap:14px;padding-bottom:4px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.user{justify-content:flex-end}
.mini{flex:none;width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center}
.col{display:flex;flex-direction:column;min-width:0;max-width:calc(100% - 38px)}
.row.user .col{max-width:86%;align-items:flex-end}
.bubble{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.55;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
.bubble.ai{background:var(--chat);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.me{background:var(--user-bubble);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap;box-shadow:0 6px 18px rgba(8,124,255,.3)}
.bubble.err{background:rgba(255,92,122,.1);border:1px solid rgba(255,92,122,.45)}
.bubble.err strong{color:var(--danger)}
.bubble p+p,.bubble ul+p,.bubble ol+p,.bubble p+ul,.bubble p+ol,.bubble pre+p,.bubble p+pre,.bubble h4+p{margin-top:8px}
.bubble ul,.bubble ol{padding-left:20px;margin-top:6px}
.bubble li{margin:2px 0}
.bubble h3,.bubble h4,.bubble h5{font-family:var(--display);margin:10px 0 4px;line-height:1.3}
.bubble h3{font-size:17px}.bubble h4{font-size:16px}.bubble h5{font-size:15px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:rgba(53,232,255,.12);padding:1px 6px;border-radius:6px}
.bubble pre{margin-top:8px;background:#030A22;color:#DCE8FF;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
[data-theme="light"] .bubble pre{background:#0A1535}
.bubble pre code{background:none;padding:0;font-size:12.5px;white-space:pre}
.bubble a{color:var(--cyan);text-decoration:underline}
.attach-tag{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9;margin-bottom:6px}
.attach-tag img{width:96px;height:96px;object-fit:cover;border-radius:10px;display:block}
.actions{display:flex;gap:4px;margin-top:4px;padding-left:4px}
.act{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);padding:5px 8px;border-radius:8px}
.act:active{background:var(--card)}
.act.done{color:var(--ok)}
.think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.caret::after{content:"";display:inline-block;width:7px;height:15px;margin-left:2px;vertical-align:-2px;background:var(--cyan);animation:pulse .8s infinite}

/* Composer */
.composer{flex:none;padding:8px calc(var(--sar) + 12px) 10px calc(var(--sal) + 12px)}
.preview{display:none;align-items:center;gap:10px;margin:0 4px 8px;padding:6px 10px 6px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.preview.show{display:flex}
.preview img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.preview span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{display:flex;align-items:flex-end;gap:4px;padding:6px;border-radius:26px;background:var(--chat);border:1px solid var(--line);box-shadow:0 0 0 0 rgba(53,232,255,0);transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--cyan);box-shadow:0 0 18px rgba(53,232,255,.18)}
.tool{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .15s,background .15s}
.tool:active{background:var(--card)}
.tool.on{color:#fff;background:var(--danger);animation:pulse 1.1s infinite}
textarea#input{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;font-size:16px;line-height:1.4;padding:9px 4px;max-height:140px;color:var(--text)}
textarea#input::placeholder{color:var(--muted)}
.send{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#031030;box-shadow:0 0 16px rgba(8,124,255,.5);transition:transform .15s,opacity .15s}
.send:active{transform:scale(.9)}
.send:disabled{box-shadow:none;background:var(--card);color:var(--muted);opacity:1}
.hint{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}

/* Bottom nav */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);padding:6px calc(var(--sar) + 8px) calc(var(--sab) + 6px) calc(var(--sal) + 8px);background:var(--bg2);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11.5px;color:var(--muted);border-radius:14px;position:relative;transition:color .2s}
.tab.active{color:var(--cyan)}
.tab.active::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}

/* Lists/cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-family:var(--display);font-size:15px;margin-bottom:8px}
.card p{color:var(--muted);font-size:13.5px}
.card p+p{margin-top:8px}
.field{width:100%;padding:11px 14px;border-radius:14px;background:var(--chat);border:1px solid var(--line);outline:0;font-size:16px}
.field:focus{border-color:var(--cyan)}
.hist{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.hist.current{border-color:var(--cyan)}
.hist .meta{flex:1;min-width:0}
.hist .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .d{font-size:11px;color:var(--muted);margin-top:2px}
.hist .icon-btn{width:34px;height:34px;background:transparent}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty h3{color:var(--text);font-family:var(--display);margin-bottom:6px}
.empty .pill-btn{margin-top:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--chat);font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(53,232,255,.08)}
.char{display:flex;gap:12px;align-items:center}
.char .orb{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;color:#031030}
.char .info{flex:1;min-width:0}
.char .info b{font-family:var(--display);font-size:15px}
.char .info p{font-size:12.5px;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span:first-child{color:var(--muted)}
.profile{display:flex;align-items:center;gap:12px}
.profile .avatar{width:52px;height:52px;font-size:20px}

/* Toast + modal */
#toast{position:absolute;left:50%;bottom:calc(var(--sab) + 140px);transform:translate(-50%,20px);max-width:86%;padding:10px 16px;border-radius:14px;background:#13235f;color:#fff;border:1px solid var(--cyan);font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(2,5,15,.65);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.sheet{width:100%;padding:20px 18px calc(var(--sab) + 18px);background:var(--card);border-top:1px solid var(--cyan);border-radius:24px 24px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--display);font-size:17px;margin-bottom:6px}
.sheet p{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.sheet .btns{display:flex;gap:10px;margin-top:14px}
.sheet .btns button{flex:1;padding:12px;border-radius:14px;font-weight:600;border:1px solid var(--line);background:var(--chat)}
.sheet .btns .ok{background:linear-gradient(135deg,var(--blue),#0A5FE0);border-color:transparent;color:#fff}
.sheet .btns .ok.danger{background:var(--danger)}

@media (max-height:640px){.robot-wrap{max-height:22vh}.hero p{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app" data-theme-root>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17zM14.5 7.5l2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header class="header">
    <div class="logo" aria-hidden="true"><svg width="24" height="24" style="color:#031030"><use href="#i-logo"/></svg></div>
    <div class="brand">
      <h1>Aryan AI</h1>
      <p data-i18n="subtitle">Your Smart AI Assistant</p>
    </div>

<script>
'use strict';
/* =====================================================================
   CONFIG - the only block you need to edit to match your backend.
   ===================================================================== */
const CONFIG = {
  API_URL: 'https://aryan-backend-lber.vercel.app/api/chat',
  TIMEOUT_MS: 60000,
  MAX_HISTORY: 20,          // how many previous messages are sent as context
  SEND_IMAGES: false,       // set true only after your backend accepts an "image" field (base64 data URL)
  PERSONA_MODE: 'field',    // 'field' = send "character" field, 'prefix' = prepend persona instruction to the message

  /* What we POST. Change field names here if your backend expects something else. */
  buildRequest({ message, messages, character, language, image }) {
    const body = { message, messages, character, language };
    if (image) body.image = image;
    return body;
  },

  /* How we read the reply. Tries common field names; edit if your backend differs. */
  parseResponse(data) { return pickText(data); }
};

/* ---------- i18n (UI strings) ---------- */
const I18N = {
  en: { subtitle:'Your Smart AI Assistant', free:'Free plan', newChat:'New chat', home:'Home', history:'History', characters:'Characters', settings:'Settings',
    heroSub:'Ask me anything. I can explain, write, plan and help you code.', hint:'Enter to send · Shift + Enter for new line',
    historySub:'Your conversations are saved on this device.', charactersSub:'Pick who you want to talk to. Applies to your next message.',
    placeholder:'Ask Aryan anything...', thinking:'Aryan is thinking…', copy:'Copy', copied:'Copied', regen:'Regenerate', retry:'Try again',
    noChats:'No chats yet', noChatsSub:'Start a conversation from Home and it will show up here.', startChat:'Start chatting',
    rename:'Rename', del:'Delete', cancel:'Cancel', save:'Save', untitled:'New conversation', use:'Use', inUse:'Selected' },
  hi: { subtitle:'आपका स्मार्ट AI असिस्टेंट', free:'फ्री प्लान', newChat:'नई चैट', home:'होम', history:'हिस्ट्री', characters:'कैरेक्टर', settings:'सेटिंग्स',
    heroSub:'कुछ भी पूछिए। मैं समझा सकता हूँ, लिख सकता हूँ, प्लान बना सकता हूँ और कोडिंग में मदद कर सकता हूँ।', hint:'भेजने के लिए Enter · नई लाइन के लिए Shift + Enter',
    historySub:'आपकी चैट इसी डिवाइस पर सेव रहती हैं।', charactersSub:'चुनिए किससे बात करनी है। अगले मैसेज से लागू होगा।',
    placeholder:'आर्यन से कुछ भी पूछें...', thinking:'आर्यन सोच रहा है…', copy:'कॉपी', copied:'कॉपी हुआ', regen:'दोबारा बनाएँ', retry:'फिर कोशिश करें',
    noChats:'अभी कोई चैट नहीं', noChatsSub:'होम से बातचीत शुरू करें, वह यहाँ दिखेगी।', startChat:'चैट शुरू करें',
    rename:'नाम बदलें', del:'हटाएँ', cancel:'रद्द करें', save:'सेव करें', untitled:'नई बातचीत', use:'चुनें', inUse:'चुना हुआ' }
};

const CHARACTERS = [
  { id:'aryan',  name:'Aryan',          role:'Smart everyday assistant', hue:'linear-gradient(135deg,#35E8FF,#087CFF)', initial:'A',
    chips:['Explain a topic simply','Write a short email','Plan my day','Give me a quick recipe'],
    prompt:'You are Aryan, a friendly and smart AI assistant. Be clear and helpful.' },
  { id:'coder',  name:'Code Buddy',     role:'Debugging, code reviews and explanations', hue:'linear-gradient(135deg,#7CFFB2,#087CFF)', initial:'C',
    chips:['Explain this error message','Review my JavaScript function','Write a SQL query','Convert this to Python'],
    prompt:'You are Code Buddy, a patient senior software engineer. Give working code with short explanations.' },
  { id:'mentor', name:'Study Mentor',   role:'Learn any subject step by step', hue:'linear-gradient(135deg,#FFD36B,#FF7A59)', initial:'S',
    chips:['Teach me photosynthesis','Quiz me on algebra','Make a study plan','Explain like I am 12'],
    prompt:'You are Study Mentor, a supportive teacher. Explain step by step and check understanding.' },
  { id:'writer', name:'Writing Partner',role:'Drafts, edits and ideas', hue:'linear-gradient(135deg,#C7A6FF,#087CFF)', initial:'W',
    chips:['Improve this paragraph','Write a product description','Draft a polite reply','Brainstorm captions'],
    prompt:'You are Writing Partner, a skilled editor and copywriter. Keep the writing natural and concise.' }
];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id, s = 16) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

function pickText(d, depth = 0) {
  if (d == null || depth > 6) return '';
  if (typeof d === 'string') return d.trim();
  if (Array.isArray(d)) return d.map(x => pickText(x, depth + 1)).filter(Boolean).join('\n');
  if (typeof d === 'object') {
    for (const k of ['reply','response','answer','text','message','output','content','result','completion','data']) {
      if (d[k] != null) { const v = pickText(d[k], depth + 1); if (v) return v; }
    }
    if (d.choices && d.choices[0]) return pickText(d.choices[0].message || d.choices[0].text || d.choices[0], depth + 1);
  }
  return '';
}

/* ---------- storage ---------- */
const KEY_CHATS = 'aryan.chats.v1', KEY_SET = 'aryan.settings.v1';
const state = {
  chats: [], activeId: null, busy: false, errors: {}, image: null, view: 'home',
  settings: { theme: 'navy', lang: 'en', character: 'aryan' }
};
function load() {
  try { const c = JSON.parse(localStorage.getItem(KEY_CHATS)); if (Array.isArray(c)) state.chats = c; } catch (e) {}
  try { const s = JSON.parse(localStorage.getItem(KEY_SET)); if (s) Object.assign(state.settings, s); } catch (e) {}
  const last = state.chats.slice().sort((a, b) => b.updated - a.updated)[0];
  state.activeId = last ? last.id : null;
}
function saveChats() {
  try { localStorage.setItem(KEY_CHATS, JSON.stringify(state.chats, (k, v) => k === 'imgUrl' ? undefined : v)); }
  catch (e) { toast('Storage is full. Delete some old chats to keep saving.'); }
}
function saveSettings() { try { localStorage.setItem(KEY_SET, JSON.stringify(state.settings)); } catch (e) {} }
const t = k => (I18N[state.settings.lang] || I18N.en)[k] || I18N.en[k] || k;
const activeChat = () => state.chats.find(c => c.id === state.activeId) || null;
const persona = () => CHARACTERS.find(c => c.id === state.settings.character) || CHARACTERS[0];

/* ---------- toast & modal ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
let modalCb = null;
function openModal({ title, text = '', input = null, ok = 'OK', danger = false, onOk }) {
  $('#mTitle').textContent = title; $('#mText').textContent = text; $('#mText').style.display = text ? '' : 'none';
  const inp = $('#mInput'); inp.style.display = input === null ? 'none' : ''; if (input !== null) inp.value = input;
  const okb = $('#mOk'); okb.textContent = ok; okb.classList.toggle('danger', danger);
  $('#mCancel').textContent = t('cancel'); modalCb = onOk;
  $('#modal').classList.add('show');
  setTimeout(() => (input === null ? okb : inp).focus(), 50);
}
function closeModal() { $('#modal').classList.remove('show'); modalCb = null; }
$('#mCancel').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#mOk').onclick = () => { const cb = modalCb, v = $('#mInput').value.trim(); closeModal(); if (cb) cb(v); };
$('#mInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#mOk').click(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- markdown (escape first, then format) ---------- */
function inline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(src) {
  const blocks = [];
  let s = esc(src);
  if ((s.match(/```/g) || []).length % 2) s += '\n```';
  s = s.replace(/```[\w-]*\n?([\s\S]*?)```/g, (m, c) => { blocks.push('<pre><code>' + c.replace(/\n$/, '') + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  let out = '', list = null;
  const close = () => { if (list) { out += '</' + list + '>'; list = null; } };
  for (const line of s.split('\n')) {
    let m;
    if ((m = line.match(/^\u0000(\d+)\u0000$/))) { close(); out += blocks[m[1]]; }
    else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { close(); const lv = m[1].length + 2; out += `<h${lv}>${inline(m[2])}</h${lv}>`; }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!line.trim()) close();
    else { close(); out += `<p>${inline(line)}</p>`; }
  }
  close();
  return out.replace(/\u0000(\d+)\u0000/g, (m, i) => blocks[i] || '');
}

/* ---------- rendering ---------- */
const scrollEl = $('#scroll'), msgsEl = $('#msgs');
function nearBottom() { return scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 120; }
function toBottom(smooth = true) { scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); }

function applyStatic() {
  document.documentElement.lang = state.settings.lang;
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#input').placeholder = t('placeholder');
  const p = persona();
  $('#heroTitle').innerHTML = `Hi, I'm <span>${esc(p.name)}</span>`;
  if (state.settings.lang === 'hi') $('#heroTitle').innerHTML = `नमस्ते, मैं <span>${esc(p.name)}</span> हूँ`;
  $('#heroSub').textContent = p.id === 'aryan' ? t('heroSub') : p.role + '.';
  $('#chips').innerHTML = p.chips.map(c => `<button class="chip" type="button">${esc(c)}</button>`).join('');
  document.documentElement.dataset.theme = state.settings.theme === 'navy' ? '' : state.settings.theme;
  const tc = { navy: '#050B25', midnight: '#02050F', light: '#EAF1FF' }[state.settings.theme] || '#050B25';
  $('meta[name="theme-color"]').content = tc;
}

function messageHTML(m, i, msgs, animate) {
  if (m.role === 'user') {
    let extra = '';
    if (m.imgUrl) extra = `<div class="attach-tag"><img src="${m.imgUrl}" alt="Attached image"></div>`;
    else if (m.hasImage) extra = `<div class="attach-tag">${icon('img', 14)} Image attached</div>`;
    return `<div class="row user"><div class="col"><div class="bubble me">${extra}${esc(m.content)}</div></div></div>`;
  }
  const last = i === msgs.length - 1;
  return `<div class="row"><div class="mini" aria-hidden="true"><svg width="16" height="16" style="color:#031030"><use href="#i-logo"/></svg></div>
    <div class="col"><div class="bubble ai${animate ? ' caret' : ''}" data-id="${m.id}">${animate ? '' : md(m.content)}</div>
    <div class="actions">
      <button class="act" data-act="copy" data-id="${m.id}">${icon('copy', 14)}<span>${t('copy')}</span></button>
      ${last ? `<button class="act" data-act="regen">${icon('redo', 14)}<span>${t('regen')}</span></button>` : ''}
    </div></div></div>`;
}

function render(animateLast = false) {
  const chat = activeChat();
  const msgs = chat ? chat.messages : [];
  $('#hero').style.display = msgs.length || state.busy || (chat && state.errors[chat.id]) ? 'none' : '';
  $('#chatTitle').textContent = chat ? chat.title : t('untitled');
  let html = msgs.map((m, i) => messageHTML(m, i, msgs, animateLast && i === msgs.length - 1 && m.role === 'assistant')).join('');
  if (state.busy && state.busyChat === state.activeId) {
    html += `<div class="row"><div class="mini" aria-hidden="true"><svg width="16" height="16" style="color:#031030"><use href="#i-logo"/></svg></div>
      <div class="col"><div class="bubble ai"><div class="think"><span class="dots"><i></i><i></i><i></i></span><span>${t('thinking')}</span></div></div></div></div>`;
  }
  const err = chat && state.errors[chat.id];
  if (err) {
    html += `<div class="row"><div class="mini" aria-hidden="true"><svg width="16" height="16" style="color:#031030"><use href="#i-logo"/></svg></div>
      <div class="col"><div class="bubble ai err"><strong>Couldn't get a reply.</strong><br>${esc(err)}</div>
      <div class="actions"><button class="act" data-act="retry">${icon('redo', 14)}<span>${t('retry')}</span></button></div></div></div>`;
  }
  msgsEl.innerHTML = html;
  if (animateLast && msgs.length) {
    const m = msgs[msgs.length - 1];
    const el = msgsEl.querySelector(`.bubble[data-id="${m.id}"]`);
    if (el) typeOut(el, m.content);
  }
  toBottom(false);
}

function typeOut(el, text) {
  const total = text.length, perFrame = Math.max(2, Math.ceil(total / 110));
  let n = 0;
  (function step() {
    if (!el.isConnected) return;
    n = Math.min(total, n + perFrame);
    const stick = nearBottom();
    el.innerHTML = md(text.slice(0, n));
    if (n < total) { el.classList.add('caret'); if (stick) toBottom(false); requestAnimationFrame(step); }
    else { el.classList.remove('caret'); if (stick) toBottom(false); }
  })();
}

/* ---------- API ---------- */
function friendlyError(e) {
  if (e.name === 'AbortError') return 'The request took too long. Check your connection and try again.';
  if (e instanceof TypeError) return "Can't reach the Aryan AI server. Check your internet connection. If it keeps happening, the server may be offline or blocking this site (CORS).";
  return e.message || 'Something went wrong. Please try again.';
}

async function callApi(chat) {
  const history = chat.messages.slice(-CONFIG.MAX_HISTORY).map(m => ({ role: m.role, content: m.content }));
  const lastUser = [...chat.messages].reverse().find(m => m.role === 'user');
  const p = persona();
  let message = lastUser.content;
  if (CONFIG.PERSONA_MODE === 'prefix' && p.id !== 'aryan') message = `[${p.prompt}]\n\n${message}`;
  let image = null;
  if (CONFIG.SEND_IMAGES && lastUser.pendingImage) image = lastUser.pendingImage;
  const body = CONFIG.buildRequest({ message, messages: history, character: p.id, language: state.settings.lang, image });

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json, text/plain' },
      body: JSON.stringify(body), signal: ctrl.signal
    });
    const raw = await res.text();
    if (!res.ok) {
      let detail = ''; try { detail = pickText(JSON.parse(raw)); } catch (e) { detail = raw.slice(0, 160); }
      throw new Error(`Server returned ${res.status}${detail ? ': ' + detail : ''}`);
    }
    let data; try { data = JSON.parse(raw); } catch (e) { data = raw; }
    const reply = CONFIG.parseResponse(data);
    if (!reply) { console.warn('Aryan AI: unrecognised response format', data); throw new Error('The server replied in a format this app does not recognise. Open CONFIG.parseResponse in index.html to adjust it.'); }
    return reply;
  } finally { clearTimeout(timer); }
}

async function respond(chatId) {
  const chat = state.chats.find(c => c.id === chatId); if (!chat) return;
  delete state.errors[chatId];
  state.busy = true; state.busyChat = chatId; updateSend(); if (state.activeId === chatId) render();
  try {
    const reply = await callApi(chat);
    chat.messages.push({ id: uid(), role: 'assistant', content: reply, ts: Date.now() });
    chat.updated = Date.now();
    state.busy = false; saveChats();
    if (state.activeId === chatId) render(true);
  } catch (e) {
    state.busy = false; state.errors[chatId] = friendlyError(e);
    if (state.activeId === chatId) render();
  }
  updateSend();
}

async function sendMessage(text) {
  text = text.trim();
  if (!text || state.busy) return;
  let chat = activeChat();
  if (!chat) {
    chat = { id: uid(), title: text.replace(/\s+/g, ' ').slice(0, 40), messages: [], created: Date.now(), updated: Date.now() };
    state.chats.push(chat); state.activeId = chat.id;
  }
  const msg = { id: uid(), role: 'user', content: text, ts: Date.now() };
  if (state.image) {
    msg.hasImage = true; msg.imgUrl = state.image.url;
    if (CONFIG.SEND_IMAGES) { try { msg.pendingImage = await toDataURL(state.image.file); } catch (e) { toast('Could not read the image.'); } }
    else toast('Image added to chat. Your backend is not set up for images yet, so only the text is sent.');
    clearImage(false);
  }
  chat.messages.push(msg); chat.updated = Date.now(); delete state.errors[chat.id];
  saveChats();
  const inp = $('#input'); inp.value = ''; autosize(); updateSend();
  setView('home'); render();
  await respond(chat.id);
  if (msg.pendingImage) delete msg.pendingImage;
}

function regenerate() {
  const chat = activeChat(); if (!chat || state.busy) return;
  const last = chat.messages[chat.messages.length - 1];
  if (last && last.role === 'assistant') chat.messages.pop();
  if (!chat.messages.length) return;
  saveChats(); respond(chat.id);
}

/* ---------- chats ---------- */
function newChat() {
  if (state.busy) { toast('Wait for the current reply to finish.'); return; }
  state.activeId = null; setView('home'); render(); $('#input').focus();
}
function renameChat(id) {
  const c = state.chats.find(x => x.id === id); if (!c) return;
  openModal({ title: t('rename'), input: c.title, ok: t('save'), onOk: v => { if (v) { c.title = v.slice(0, 60); c.updated = Date.now(); saveChats(); renderHistory(); render(); } } });
}
function deleteChat(id) {
  const c = state.chats.find(x => x.id === id); if (!c) return;
  openModal({ title: t('del') + '?', text: `"${c.title}" will be removed from this device.`, ok: t('del'), danger: true, onOk: () => {
    state.chats = state.chats.filter(x => x.id !== id); delete state.errors[id];
    if (state.activeId === id) state.activeId = null;
    saveChats(); renderHistory(); render();
  } });
}
function openChat(id) { if (state.busy && id !== state.activeId) { toast('Wait for the current reply to finish.'); return; } state.activeId = id; setView('home'); render(); }

function fmtDate(ts) {
  const d = new Date(ts), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function renderHistory() {
  const q = $('#histSearch').value.trim().toLowerCase();
  const list = state.chats.slice().sort((a, b) => b.updated - a.updated).filter(c => !q || c.title.toLowerCase().includes(q));
  const box = $('#histList');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><h3>${q ? 'No matching chats' : t('noChats')}</h3><p>${q ? 'Try a different word.' : t('noChatsSub')}</p>${q ? '' : `<button class="pill-btn primary" data-go="new">${t('startChat')}</button>`}</div>`;
    return;
  }
  box.innerHTML = list.map(c => {
    const lastM = c.messages[c.messages.length - 1];
    return `<div class="hist${c.id === state.activeId ? ' current' : ''}" data-open="${c.id}" role="button" tabindex="0" aria-label="Open chat ${esc(c.title)}">
      <div class="meta"><div class="t">${esc(c.title)}</div><div class="s">${esc(lastM ? lastM.content.replace(/\s+/g, ' ').slice(0, 80) : '')}</div><div class="d">${fmtDate(c.updated)} · ${c.messages.length} messages</div></div>
      <button class="icon-btn" data-rename="${c.id}" aria-label="Rename chat">${icon('edit', 17)}</button>
      <button class="icon-btn" data-delete="${c.id}" aria-label="Delete chat" style="color:var(--danger)">${icon('trash', 17)}</button></div>`;
  }).join('');
}

function renderCharacters() {
  $('#charList').innerHTML = CHARACTERS.map(c => {
    const on = c.id === state.settings.character;
    return `<div class="card char"><div class="orb" style="background:${c.hue}">${c.initial}</div>
      <div class="info"><b>${esc(c.name)}</b><p>${esc(c.role)}</p></div>
      <button class="pill-btn${on ? '' : ' primary'}" data-char="${c.id}" ${on ? 'aria-pressed="true"' : ''}>${on ? icon('check', 14) + t('inUse') : t('use')}</button></div>`;
  }).join('');
}

function renderSettings() {
  const s = state.settings;
  const seg = (name, opts) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-set="${name}" data-v="${v}" aria-pressed="${s[name] === v}">${l}</button>`).join('')}</div>`;
  $('#settingsBody').innerHTML = `
    <h2 class="screen-title">${t('settings')}</h2>
    <div class="card"><div class="profile"><div class="icon-btn avatar">A</div><div><b style="font-family:var(--display)">Guest</b><p>${t('free')} · ${state.chats.length} chats saved</p></div></div></div>
    <div class="card"><h3>Theme</h3>${seg('theme', [['navy', 'Navy'], ['midnight', 'Midnight'], ['light', 'Light']])}</div>
    <div class="card"><h3>Language</h3>${seg('lang', [['en', 'English'], ['hi', 'हिन्दी']])}<p style="margin-top:8px">Changes the app text and voice input language.</p></div>
    <div class="card"><h3>Data</h3><p>Chats are stored only in this browser on your device.</p><div style="margin-top:12px"><button class="pill-btn danger" id="btnClear">${icon('trash', 15)} Clear chat history</button></div></div>
    <div class="card"><h3>App information</h3>
      <div class="kv"><span>App</span><span>Aryan AI</span></div><div class="kv"><span>Version</span><span>1.0.0</span></div>
      <div class="kv"><span>Plan</span><span>${t('free')}</span></div><div class="kv"><span>Chats saved</span><span>${state.chats.length}</span></div></div>
    <div class="card"><h3>About Aryan AI</h3><p>Aryan AI is a smart assistant that answers questions, explains ideas, helps with writing and code, and keeps your conversations organised in one place.</p></div>
    <div class="card"><h3>Privacy</h3><p>Your chats and settings are saved in this browser only. When you send a message, its text and recent chat context are sent to the Aryan AI server to generate a reply.</p><p>This app has no analytics or ad trackers. Clearing your browser data or using "Clear chat history" removes saved chats.</p><p>AI replies can be wrong. Check important information before relying on it.</p></div>`;
}

/* ---------- navigation ---------- */
function setView(v) {
  state.view = v;
  $$('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + v));
  $$('.tab').forEach(b => { const on = b.dataset.tab === v; b.classList.toggle('active', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (v === 'history') renderHistory();
  if (v === 'characters') renderCharacters();
  if (v === 'settings') renderSettings();
  if (v === 'home') setTimeout(() => toBottom(false), 0);
}
$$('.tab').forEach(b => b.addEventListener('click', () => setView(b.dataset.tab)));
$('#btnProfile').onclick = () => setView('settings');
$('#btnNew').onclick = newChat;

/* ---------- events (delegated) ---------- */
msgsEl.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'regen') regenerate();
  else if (a === 'retry') { const c = activeChat(); if (c) respond(c.id); }
  else if (a === 'copy') {
    const m = activeChat().messages.find(x => x.id === b.dataset.id); if (!m) return;
    const ok = await copyText(m.content);
    const span = b.querySelector('span'); b.classList.add('done'); span.textContent = ok ? t('copied') : 'Copy failed';
    setTimeout(() => { b.classList.remove('done'); span.textContent = t('copy'); }, 1600);
  }
});
$('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) sendMessage(c.textContent); });
$('#histSearch').addEventListener('input', renderHistory);
$('#histList').addEventListener('click', e => {
  const r = e.target.closest('[data-rename]'), d = e.target.closest('[data-delete]'), o = e.target.closest('[data-open]'), g = e.target.closest('[data-go]');
  if (r) return renameChat(r.dataset.rename);
  if (d) return deleteChat(d.dataset.delete);
  if (g) return newChat();
  if (o) openChat(o.dataset.open);
});
$('#histList').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.open) { e.preventDefault(); openChat(e.target.dataset.open); } });
$('#charList').addEventListener('click', e => {
  const b = e.target.closest('[data-char]'); if (!b) return;
  state.settings.character = b.dataset.char; saveSettings(); applyStatic(); renderCharacters();
  toast(`${persona().name} selected`);
});
$('#settingsBody').addEventListener('click', e => {
  const b = e.target.closest('[data-set]');
  if (b) { state.settings[b.dataset.set] = b.dataset.v; saveSettings(); applyStatic(); renderSettings(); render(); if (recog) { recog.lang = voiceLang(); } return; }
  if (e.target.closest('#btnClear')) {
    openModal({ title: 'Clear all chats?', text: 'All saved conversations will be deleted from this device. This cannot be undone.', ok: 'Clear all', danger: true, onOk: () => {
      state.chats = []; state.activeId = null; state.errors = {}; saveChats(); renderSettings(); render(); toast('Chat history cleared');
    } });
  }
});

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; }
    catch (e2) { return false; }
  }
}

/* ---------- composer ---------- */
const inputEl = $('#input'), sendBtn = $('#btnSend');
function autosize() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px'; }
function updateSend() { sendBtn.disabled = state.busy || !inputEl.value.trim(); }
inputEl.addEventListener('input', () => { autosize(); updateSend(); });
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!sendBtn.disabled) sendMessage(inputEl.value); }
});
sendBtn.onclick = () => sendMessage(inputEl.value);

/* image attach */
$('#btnAttach').onclick = () => $('#file').click();
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!f.type.startsWith('image/')) return toast('Please choose an image file.');
  if (f.size > 10 * 1024 * 1024) return toast('That image is larger than 10 MB.');
  clearImage(true);
  state.image = { file: f, url: URL.createObjectURL(f) };
  $('#previewImg').src = state.image.url; $('#previewName').textContent = f.name; $('#preview').classList.add('show');
  if (!CONFIG.SEND_IMAGES) toast('Image attached. Image understanding is not connected yet.');
  inputEl.focus();
});
function clearImage(revoke) {
  if (state.image && revoke) URL.revokeObjectURL(state.image.url);
  state.image = null; $('#preview').classList.remove('show'); $('#previewImg').removeAttribute('src');
}
$('#btnRemoveImg').onclick = () => clearImage(true);
function toDataURL(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1024, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

/* voice input */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;
const voiceLang = () => state.settings.lang === 'hi' ? 'hi-IN' : 'en-IN';
$('#btnMic').onclick = () => {
  if (!SR) return toast("Voice input isn't supported in this browser. Type your message instead.");
  if (listening) { recog.stop(); return; }
  recog = new SR(); recog.lang = voiceLang(); recog.interimResults = true; recog.continuous = false;
  const base = inputEl.value ? inputEl.value.trimEnd() + ' ' : '';
  recog.onstart = () => { listening = true; $('#btnMic').classList.add('on'); $('#btnMic').setAttribute('aria-pressed', 'true'); };
  recog.onresult = ev => { let txt = ''; for (const r of ev.results) txt += r[0].transcript; inputEl.value = base + txt; autosize(); updateSend(); };
  recog.onerror = ev => {
    const m = { 'not-allowed': 'Microphone permission was denied. Allow it in your browser settings.', 'service-not-allowed': 'Microphone permission was denied.', 'no-speech': "Didn't catch anything. Try again.", 'network': 'Voice recognition needs an internet connection.' }[ev.error];
    toast(m || 'Voice input failed. Try again.');
  };
  recog.onend = () => { listening = false; $('#btnMic').classList.remove('on'); $('#btnMic').setAttribute('aria-pressed', 'false'); inputEl.focus(); };
  try { recog.start(); } catch (e) { toast('Voice input could not start.'); }
};

/* ---------- viewport (iOS keyboard) ---------- */
function fitViewport() {
  const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  if (window.visualViewport && window.visualViewport.offsetTop) window.scrollTo(0, 0);
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', () => { fitViewport(); if (nearBottom()) toBottom(false); }); window.visualViewport.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);
window.addEventListener('orientationchange', () => setTimeout(fitViewport, 200));

/* ---------- init ---------- */
load(); fitViewport(); applyStatic(); render(); updateSend();
</script>
</body>
