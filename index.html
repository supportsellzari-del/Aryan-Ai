<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #02090e;
    color: #00eaff;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.app {
    width: 100%;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at center, #07303a 0%, #02090e 65%);
}

header {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #00eaff55;
    background: #03151dcc;
    position: relative;
    z-index: 5;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00eaff;
}

.status {
    font-size: 12px;
    color: #00ff9d;
}

main {
    height: calc(100dvh - 65px);
    display: grid;
    grid-template-columns: 240px 1fr 240px;
    position: relative;
}

.panel {
    margin: 20px 12px;
    padding: 18px;
    border: 1px solid #00eaff55;
    background: #03151d99;
    box-shadow: 0 0 20px #00eaff12;
    border-radius: 12px;
    height: fit-content;
    z-index: 2;
}

.panel h3 {
    font-size: 13px;
    margin-bottom: 18px;
    letter-spacing: 2px;
}

.info {
    font-size: 12px;
    color: #8bcbd2;
    line-height: 2.5;
}

.center {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
}

#avatar {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    z-index: 1;
}

.hologram {
    position: absolute;
    width: 280px;
    height: 280px;
    border: 1px solid #00eaff66;
    border-radius: 50%;
    box-shadow: 0 0 35px #00eaff33,
                inset 0 0 35px #00eaff22;
    animation: rotate 12s linear infinite;
}

.hologram::before {
    content: "";
    position: absolute;
    inset: 20px;
    border: 1px dashed #00eaff99;
    border-radius: 50%;
}

.hologram::after {
    content: "";
    position: absolute;
    inset: 45px;
    border: 1px solid #00eaff55;
    border-radius: 50%;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

.scan {
    position: absolute;
    width: 100%;
    height: 2px;
    background: #00eaff66;
    box-shadow: 0 0 15px #00eaff;
    animation: scan 5s linear infinite;
    z-index: 3;
    pointer-events: none;
}

@keyframes scan {
    0% { top: 10%; }
    100% { top: 90%; }
}

.avatar-label {
    position: absolute;
    bottom: 75px;
    z-index: 4;
    text-align: center;
    font-size: 12px;
    letter-spacing: 4px;
    text-shadow: 0 0 12px #00eaff;
    pointer-events: none;
}

.chat {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(600px, 90%);
    display: flex;
    gap: 8px;
    z-index: 6;
}

.chat input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    background: #031b25;
    border: 1px solid #00eaff88;
    border-radius: 30px;
    outline: none;
    color: white;
}

.chat button {
    padding: 0 22px;
    border: 1px solid #00eaff;
    background: #003b49;
    color: #00eaff;
    border-radius: 30px;
    cursor: pointer;
}

#message {
    position: absolute;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    color: #9cecf2;
    font-size: 12px;
    text-align: center;
    width: 90%;
    z-index: 5;
}

@media(max-width: 750px) {
    main {
        grid-template-columns: 1fr;
    }

    .panel {
        display: none;
    }

    .hologram {
        width: 230px;
        height: 230px;
    }

    .avatar-label {
        bottom: 100px;
    }
}

@media(max-height: 500px) {
    .panel {
        margin-top: 5px;
        padding: 10px;
    }

    .hologram {
        width: 180px;
        height: 180px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">JARVIS</div>
    <div class="status">● SYSTEM ONLINE</div>
</header>

<main>

    <section class="panel">
        <h3>SYSTEM STATUS</h3>
        <div class="info">
            AI CORE : ONLINE<br>
            AVATAR : LOADING<br>
            VOICE : STANDBY<br>
            NETWORK : CONNECTED<br>
            SECURITY : ACTIVE
        </div>
    </section>

    <section class="center">

        <div class="hologram"></div>

        <div id="avatar"></div>

        <div class="scan"></div>

        <div class="avatar-label">
            JARVIS AI ASSISTANT
        </div>

    </section>

    <section class="panel">
        <h3>AI INFORMATION</h3>
        <div class="info">
            PERSONAL AI<br>
            3D AVATAR<br>
            INTERFACE V1.0<br>
            MODE : READY
        </div>
    </section>

</main>

<div id="message">
    JARVIS Interface Ready — AI Connection Pending
</div>

<div class="chat">
    <input id="chatInput"
           placeholder="Talk to JARVIS..."
           autocomplete="off">

    <button onclick="sendMessage()">SEND</button>
</div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

import {
    VRMLoaderPlugin,
    VRMUtils
} from "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js";

const container = document.getElementById("avatar");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    30,
    container.clientWidth / container.clientHeight,
    0.1,
    100
);

camera.position.set(0, 1.35, 3.5);

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
    0xffffff,
    0x335566,
    2
));

const light = new THREE.DirectionalLight(0xffffff, 2);

light.position.set(1, 2, 3);

scene.add(light);

let currentVRM = null;

const loader = new GLTFLoader();

loader.register((parser) => {
    return new VRMLoaderPlugin(parser);
});

loader.load(
    "./assets/models/jarvis.vrm",

    (gltf) => {

        const vrm = gltf.userData.vrm;

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        scene.add(vrm.scene);

        currentVRM = vrm;

        // Face the camera
        vrm.scene.rotation.y = Math.PI;

        // Position avatar
        vrm.scene.position.set(0, -0.9, 0);

        document.getElementById("message").textContent =
            "JARVIS Avatar Successfully Loaded";

    },

    undefined,

    (error) => {

        console.error("VRM Loading Error:", error);

        document.getElementById("message").textContent =
            "Avatar Loading Failed — Check VRM File Path";
    }
);

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (currentVRM) {
        currentVRM.update(delta);
    }

    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {

    const width = container.clientWidth;
    const height = container.clientHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

});

</script>

<script>
function sendMessage() {

    const input = document.getElementById("chatInput");

    if (!input.value.trim()) return;

    document.getElementById("message").textContent =
        "Chat API will be connected in the next development step.";

    input.value = "";
}

document.getElementById("chatInput")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});
</script>

</body>
</html>
