<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#02090e">

<title>JARVIS AI</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02090e;
    color: #00eaff;
    font-family: Arial, sans-serif;
}

body {
    overscroll-behavior: none;
}

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;

    background:
    radial-gradient(
        ellipse at center,
        #07303a 0%,
        #02090e 70%
    );
}

/* HEADER */

header {
    height: 65px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;

    border-bottom: 1px solid #00eaff55;

    background: #03151dcc;

    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    z-index: 10;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00eaff;
}

.status {
    font-size: 12px;
    color: #00ff9d;
}

/* MAIN */

main {
    position: absolute;

    top: 65px;
    bottom: 0;

    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* SIDE PANELS */

.panel {
    position: absolute;

    top: 20px;

    width: 220px;

    padding: 18px;

    border: 1px solid #00eaff55;

    background: #03151d99;

    border-radius: 12px;

    z-index: 5;
}

.left-panel {
    left: 15px;
}

.right-panel {
    right: 15px;
}

.panel h3 {
    font-size: 13px;
    margin-bottom: 18px;
    letter-spacing: 2px;
}

.info {
    font-size: 12px;
    color: #8bcbd2;
    line-height: 2.5;
}

/* CENTER AVATAR AREA */

.center {
    position: absolute;

    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;

    min-width: 0;
    min-height: 0;
}

/* AVATAR */

#avatar {
    position: absolute;

    width: 100%;
    height: 100%;

    inset: 0;

    z-index: 2;
}

#avatar canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* HOLOGRAM */

.hologram {
    position: absolute;

    width: min(280px, 65vw);
    aspect-ratio: 1;

    border: 1px solid #00eaff66;

    border-radius: 50%;

    box-shadow:
    0 0 35px #00eaff33,
    inset 0 0 35px #00eaff22;

    animation: rotate 12s linear infinite;

    z-index: 1;

    pointer-events: none;
}

.hologram::before {
    content: "";

    position: absolute;
    inset: 20px;

    border: 1px dashed #00eaff99;
    border-radius: 50%;
}

.hologram::after {
    content: "";

    position: absolute;
    inset: 45px;

    border: 1px solid #00eaff55;
    border-radius: 50%;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

/* SCAN EFFECT */

.scan {
    position: absolute;

    width: 100%;
    height: 2px;

    background: #00eaff66;

    box-shadow: 0 0 15px #00eaff;

    animation: scan 5s linear infinite;

    z-index: 3;

    pointer-events: none;
}

@keyframes scan {

    0% {
        top: 10%;
    }

    100% {
        top: 90%;
    }

}

/* CHARACTER LABEL */

.avatar-label {
    position: absolute;

    bottom: 100px;

    z-index: 4;

    text-align: center;

    font-size: 12px;
    letter-spacing: 4px;

    text-shadow: 0 0 12px #00eaff;

    pointer-events: none;
}

/* MESSAGE */

#message {
    position: absolute;

    bottom: calc(85px + env(safe-area-inset-bottom));

    left: 50%;

    transform: translateX(-50%);

    width: min(90%, 600px);

    text-align: center;

    color: #9cecf2;

    font-size: 12px;

    z-index: 7;
}

/* CHAT */

.chat {
    position: absolute;

    bottom: calc(15px + env(safe-area-inset-bottom));

    left: 50%;

    transform: translateX(-50%);

    width: min(600px, 90%);

    display: flex;

    gap: 8px;

    z-index: 10;
}

.chat input {
    flex: 1;

    min-width: 0;

    padding: 15px;

    background: #031b25;

    border: 1px solid #00eaff88;

    border-radius: 30px;

    outline: none;

    color: white;

    font-size: 16px;
}

.chat input::placeholder {
    color: #8bcbd2;
}

.chat button {
    padding: 0 22px;

    border: 1px solid #00eaff;

    background: #003b49;

    color: #00eaff;

    border-radius: 30px;

    cursor: pointer;

    font-weight: bold;
}

.chat button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* TABLET */

@media (max-width: 1000px) {

    .panel {
        width: 175px;
        padding: 12px;
    }

    .left-panel {
        left: 8px;
    }

    .right-panel {
        right: 8px;
    }

}

/* MOBILE */

@media (max-width: 750px) {

    header {
        height: 55px;
        padding: 0 15px;
    }

    .logo {
        font-size: 20px;
    }

    .status {
        font-size: 10px;
    }

    main {
        top: 55px;
    }

    .panel {
        display: none;
    }

    .hologram {
        width: min(230px, 60vw);
    }

    .avatar-label {
        bottom: 105px;
        font-size: 10px;
        letter-spacing: 3px;
    }

    .chat {
        width: calc(100% - 24px);
        bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .chat input {
        padding: 13px;
    }

    .chat button {
        padding: 0 17px;
    }

    #message {
        bottom: calc(72px + env(safe-area-inset-bottom));
        font-size: 11px;
    }

}

/* SMALL MOBILE */

@media (max-width: 380px) {

    .logo {
        font-size: 17px;
        letter-spacing: 3px;
    }

    .chat {
        gap: 5px;
    }

    .chat input {
        padding: 12px;
        font-size: 15px;
    }

    .chat button {
        padding: 0 13px;
        font-size: 12px;
    }

    .avatar-label {
        letter-spacing: 2px;
    }

}

/* LANDSCAPE MOBILE */

@media (max-height: 500px) {

    .avatar-label {
        bottom: 65px;
    }

    .chat {
        bottom: calc(5px + env(safe-area-inset-bottom));
    }

    #message {
        bottom: calc(55px + env(safe-area-inset-bottom));
    }

    .hologram {
        width: 150px;
    }

}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {

    .hologram,
    .scan {
        animation: none;
    }

}

</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">JARVIS</div>

    <div class="status" id="systemStatus">
        ● SYSTEM ONLINE
    </div>

</header>


<main>

    <section class="panel left-panel">

        <h3>SYSTEM STATUS</h3>

        <div class="info" id="systemInfo">

            AI CORE : ONLINE<br>
            AVATAR : LOADING<br>
            VOICE : STANDBY<br>
            NETWORK : CONNECTED<br>
            SECURITY : ACTIVE

        </div>

    </section>


    <section class="center">

        <div class="hologram"></div>

        <div id="avatar"></div>

        <div class="scan"></div>

        <div class="avatar-label">
            JARVIS AI ASSISTANT
        </div>

    </section>


    <section class="panel right-panel">

        <h3>AI INFORMATION</h3>

        <div class="info">

            PERSONAL AI<br>
            3D AVATAR<br>
            INTERFACE V2.0<br>
            MODE : READY

        </div>

    </section>

</main>


<div id="message">

    Initializing JARVIS AI...

</div>


<div class="chat">

    <input
        id="chatInput"
        type="text"
        placeholder="Talk to JARVIS..."
        autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">

        SEND

    </button>

</div>

</div>


<!-- THREE JS -->

<script type="importmap">

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}

</script>


<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"three/addons/loaders/GLTFLoader.js";

import {
    VRMLoaderPlugin,
    VRMUtils
} from
"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js";


const container = document.getElementById("avatar");

const message = document.getElementById("message");

const systemInfo = document.getElementById("systemInfo");


/* SCENE */

const scene = new THREE.Scene();


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    30,
    1,
    0.1,
    100
);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({

    alpha: true,

    antialias: true,

    powerPreference: "high-performance"

});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.setClearColor(0x000000, 0);

container.appendChild(renderer.domElement);


/* LIGHTS */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x335566,
        2
    )
);

const light = new THREE.DirectionalLight(
    0xffffff,
    2
);

light.position.set(1, 2, 3);

scene.add(light);


/* AVATAR VARIABLES */

let currentVRM = null;

let avatarHeight = 1.6;


/* LOAD VRM */

const loader = new GLTFLoader();

loader.register((parser) => {

    return new VRMLoaderPlugin(parser);

});


loader.load(

    "./assets/models/viverse_avatar_model_202181.vrm",

    (gltf) => {

        const vrm = gltf.userData.vrm;

        if (!vrm) {

            throw new Error("VRM model not found");

        }

        VRMUtils.removeUnnecessaryVertices(gltf.scene);

        VRMUtils.removeUnnecessaryJoints(gltf.scene);


        // Face camera

        vrm.scene.rotation.y = Math.PI;


        // Add avatar

        scene.add(vrm.scene);


        // Calculate model dimensions

        const box = new THREE.Box3().setFromObject(vrm.scene);

        const size = new THREE.Vector3();

        const center = new THREE.Vector3();

        box.getSize(size);

        box.getCenter(center);


        avatarHeight = size.y || 1.6;


        // Put feet at floor level

        vrm.scene.position.y -= box.min.y;


        // Camera target at character center

        updateCamera();


        currentVRM = vrm;


        message.textContent =
        "JARVIS Avatar Successfully Loaded";


        systemInfo.innerHTML = `
            AI CORE : ONLINE<br>
            AVATAR : READY<br>
            VOICE : STANDBY<br>
            NETWORK : CONNECTED<br>
            SECURITY : ACTIVE
        `;

    },

    undefined,

    (error) => {

        console.error("VRM Loading Error:", error);

        message.textContent =
        "Avatar Loading Failed — Check VRM File Path";

        systemInfo.innerHTML = `
            AI CORE : ONLINE<br>
            AVATAR : ERROR<br>
            VOICE : STANDBY<br>
            NETWORK : CONNECTED
        `;

    }

);


/* RESPONSIVE CAMERA */

function updateCamera() {

    const width = container.clientWidth;

    const height = container.clientHeight;

    if (!width || !height) return;


    camera.aspect = width / height;

    camera.updateProjectionMatrix();


    const fov = THREE.MathUtils.degToRad(
        camera.fov
    );


    const verticalDistance =
        (avatarHeight / 2) / Math.tan(fov / 2);


    const horizontalFov = 2 * Math.atan(
        Math.tan(fov / 2) * camera.aspect
    );


    const horizontalDistance =
        (avatarHeight * 0.38) /
        Math.tan(horizontalFov / 2);


    const distance = Math.max(
        verticalDistance,
        horizontalDistance
    ) * 1.45;


    // Slightly wider framing on mobile

    camera.position.set(
        0,
        avatarHeight * 0.53,
        distance
    );

    camera.lookAt(
        0,
        avatarHeight * 0.52,
        0
    );


    renderer.setSize(width, height);

}


/* RESIZE */

const resizeObserver = new ResizeObserver(() => {

    updateCamera();

});

resizeObserver.observe(container);


/* ANIMATION */

const clock = new THREE.Clock();

function animate() {

    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    if (currentVRM) {

        currentVRM.update(delta);

    }

    renderer.render(scene, camera);

}

animate();


/* API CONFIG */

window.JARVIS_API =
"https://aryan-ai-backend-v2.vercel.app/api/chat";


/* CHAT HISTORY */

window.chatHistory = [];


/* SEND MESSAGE */

window.sendMessage = async function() {

    const input = document.getElementById("chatInput");

    const button = document.getElementById("sendButton");

    const userMessage = input.value.trim();

    if (!userMessage) return;


    if (button.disabled) return;


    // Save message

    window.chatHistory.push({

        role: "user",

        content: userMessage

    });


    input.value = "";

    button.disabled = true;

    button.textContent = "WAIT...";

    message.textContent = "JARVIS is thinking...";


    try {

        const response = await fetch(
            window.JARVIS_API,
            {

                method: "POST",

                headers: {

                    "Content-Type": "application/json"

                },

                body: JSON.stringify({

                    message: userMessage,

                    messages: window.chatHistory,

                    character: "assistant",

                    language: "English"

                })

            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                data.message ||
                "API request failed: " + response.status
            );

        }


        // Read different possible response formats

        const aiReply =
            data.reply ||
            data.response ||
            data.answer ||
            data.message ||
            data.output ||
            data.text ||
            data.result?.reply ||
            data.result?.response ||
            data.result?.message ||
            (typeof data.result === "string" ? data.result : null) ||
            (typeof data === "string" ? data : null);


        if (!aiReply) {

            console.error("Unexpected API response:", data);

            throw new Error(
                "API connected, but response format was unexpected."
            );

        }


        // Save AI response

        window.chatHistory.push({

            role: "assistant",

            content: aiReply

        });


        message.textContent = aiReply;


    }

    catch(error) {

        console.error("JARVIS API Error:", error);

        message.textContent =
        "Connection Error: " + error.message;

        // Remove unsent user message from history

        window.chatHistory.pop();

    }

    finally {

        button.disabled = false;

        button.textContent = "SEND";

        input.focus();

    }

};


/* ENTER KEY */

document.getElementById("chatInput")

.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        window.sendMessage();

    }

});


/* BACKEND STATUS */

async function checkBackend() {

    try {

        const response = await fetch(
            "https://aryan-ai-backend-v2.vercel.app/api/health"
        );

        if (!response.ok) {

            throw new Error("Backend offline");

        }

        document.getElementById("systemStatus").textContent =
        "● SYSTEM ONLINE";

    }

    catch(error) {

        document.getElementById("systemStatus").textContent =
        "● CONNECTION CHECK FAILED";

    }

}

checkBackend();

</script>

</body>
</html>
